function saveHistorySnapshot() {
  const ds      = viewDayStr();
  const day     = workouts[viewDay];
  const dayC    = completions[ds] || {};
  const history = lsGet('wt-history') || {};

  if (day.type === 'rest') {
    const doneRec = (day.recovery || []).filter(r => dayC[r.id]).length;
    history[ds] = {
      date: ds, dayIdx: viewDay, type: 'rest',
      label: day.label, dayName: day.dayName,
      totalRec: (day.recovery || []).length, doneRec,
    };
  } else {
    const exercises = day.exercises.map(ex => ({
      id: ex.id, name: ex.name, sets: ex.sets, reps: ex.reps,
      weight: ex.weight, done: Math.min(dayC[ex.id] || 0, ex.sets),
    }));
    const totalSets = exercises.reduce((a, e) => a + e.sets, 0);
    const doneSets  = exercises.reduce((a, e) => a + e.done,  0);
    history[ds] = {
      date: ds, dayIdx: viewDay, type: day.type,
      label: day.label, dayName: day.dayName,
      exercises, totalSets, doneSets,
    };
  }
  lsSet('wt-history', history);
  scheduleSyncToGist();
}

function renderHistory() {
  const container = document.getElementById('historyView');
  container.textContent = '';

  const history = lsGet('wt-history') || {};
  const dates   = Object.keys(history).sort((a, b) => b.localeCompare(a));

  // header
  const hdr = document.createElement('div'); hdr.className = 'hist-header';
  const ttl = document.createElement('div'); ttl.className = 'hist-title'; ttl.textContent = 'HISTORY';
  const sub = document.createElement('div'); sub.className = 'hist-sub';
  sub.textContent = dates.length === 0 ? 'No sessions logged yet'
    : dates.length + ' session' + (dates.length === 1 ? '' : 's') + ' logged';
  hdr.appendChild(ttl); hdr.appendChild(sub);
  container.appendChild(hdr);

  // gist backup section
  const gistSection = document.createElement('div'); gistSection.id = 'gistSection';
  gistSection.appendChild(buildGistSection());
  container.appendChild(gistSection);

  if (dates.length === 0) {
    const empty = document.createElement('div'); empty.className = 'hist-empty';
    const ico   = document.createElement('div'); ico.className = 'hist-empty-icon'; ico.textContent = '📭';
    const msg   = document.createElement('div'); msg.textContent = 'Complete your first workout\nto start tracking history.';
    empty.appendChild(ico); empty.appendChild(msg);
    container.appendChild(empty);
    return;
  }

  // stats chips
  const workoutDates = dates.filter(d => history[d].type !== 'rest');
  const streak       = calcStreak(dates);
  const stats = document.createElement('div'); stats.className = 'hist-stats';
  [
    [String(dates.length),    'Sessions'],
    [String(workoutDates.length), 'Workouts'],
    [String(streak),          'Streak'],
  ].forEach(([num, lbl]) => {
    const chip = document.createElement('div'); chip.className = 'stat-chip';
    const n    = document.createElement('div'); n.className = 'stat-num'; n.textContent = num;
    const l    = document.createElement('div'); l.className = 'stat-lbl'; l.textContent = lbl;
    chip.appendChild(n); chip.appendChild(l); stats.appendChild(chip);
  });
  container.appendChild(stats);

  // ── muscle volume heatmap ─────────────────────────────────────
  const volumes = calcMuscleVolume(history);
  const hasVolume = Object.keys(volumes).length > 0;

  const hmSection = document.createElement('div'); hmSection.className = 'progress-section';
  const hmLabel   = document.createElement('div'); hmLabel.className = 'progress-sec-label';
  hmLabel.textContent = 'MUSCLE VOLUME';
  hmSection.appendChild(hmLabel);

  if (!hasVolume) {
    const empty = document.createElement('div'); empty.className = 'chart-empty';
    empty.textContent = 'Log workouts to see your muscle volume heatmap';
    hmSection.appendChild(empty);
  } else {
    const bodies = document.createElement('div'); bodies.className = 'heatmap-bodies';
    ['front','back'].forEach(v => {
      const wrap = document.createElement('div'); wrap.style.cssText = 'flex:1;max-width:130px;';
      wrap.appendChild(buildBodySVG(volumeToHighlights(volumes, v), v));
      bodies.appendChild(wrap);
    });
    hmSection.appendChild(bodies);
  }
  container.appendChild(hmSection);

  // ── strength progression charts ───────────────────────────────
  const KEY_EXERCISES = [
    {name:'Barbell Bench Press',  color:'#C9A84C'},
    {name:'Romanian Deadlift',    color:'#C8552A'},
    {name:'Hip Thrust',           color:'#C8552A'},
    {name:'Pull-ups / Lat Pulldown', color:'#BFBDB3'},
  ];

  const chartsWithData = KEY_EXERCISES
    .map(ex => ({...ex, data: getStrengthHistory(history, ex.name)}))
    .filter(ex => ex.data.length >= 2);

  const spSection = document.createElement('div'); spSection.className = 'progress-section';
  const spLabel   = document.createElement('div'); spLabel.className   = 'progress-sec-label';
  spLabel.textContent = 'STRENGTH PROGRESS';
  spSection.appendChild(spLabel);

  if (chartsWithData.length === 0) {
    const empty = document.createElement('div'); empty.className = 'chart-empty';
    empty.textContent = 'Log weights for key lifts to track strength over time';
    spSection.appendChild(empty);
  } else {
    chartsWithData.forEach(ex => {
      const first = ex.data[0].weight, last = ex.data[ex.data.length-1].weight;
      const delta = last - first, pct = ((delta/first)*100).toFixed(1);

      const cc   = document.createElement('div'); cc.className = 'chart-card';
      const cHdr = document.createElement('div'); cHdr.className = 'chart-card-hdr';
      const cNm  = document.createElement('div'); cNm.className  = 'chart-card-name'; cNm.textContent = ex.name;
      const cSt  = document.createElement('div'); cSt.className  = 'chart-card-stats';
      const acc  = document.createElement('span'); acc.className = 'acc';
      acc.textContent = last + ' lbs (' + (delta >= 0 ? '+' : '') + pct + '%)';
      cSt.appendChild(acc);
      cSt.insertBefore(document.createTextNode('Latest: '), acc);
      cHdr.appendChild(cNm); cHdr.appendChild(cSt);
      cc.appendChild(cHdr);

      const cSvg = document.createElement('div'); cSvg.className = 'chart-svg-wrap';
      cSvg.appendChild(buildStrengthChart(ex.data, ex.color));
      cc.appendChild(cSvg);
      spSection.appendChild(cc);
    });
  }
  container.appendChild(spSection);

  // ── month groups ──────────────────────────────────────────────
  const hrDiv = document.createElement('div'); hrDiv.className = 'progress-sec-label';
  hrDiv.textContent = 'WORKOUT LOG';
  container.appendChild(hrDiv);

  // group by month
  const byMonth = {};
  dates.forEach(d => {
    const key = d.slice(0, 7); // YYYY-MM
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(d);
  });

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  Object.keys(byMonth).sort((a,b) => b.localeCompare(a)).forEach(monthKey => {
    const [yr, mo] = monthKey.split('-').map(Number);
    const group = document.createElement('div'); group.className = 'hist-day-group';
    const mlbl  = document.createElement('div'); mlbl.className = 'hist-month-label';
    mlbl.textContent = MONTH_NAMES[mo - 1] + ' ' + yr;
    group.appendChild(mlbl);

    byMonth[monthKey].forEach(dateStr => {
      group.appendChild(buildHistCard(dateStr, history[dateStr]));
    });
    container.appendChild(group);
  });
}

function buildHistCard(dateStr, entry) {
  const color = TYPE_COLOR[entry.type] || '#C9A84C';
  const d     = new Date(dateStr + 'T12:00:00');
  const day   = d.getDate();
  const mo    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  const wd    = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];

  const isToday = dateStr === TODAY_STR;
  const card    = document.createElement('div'); card.className = 'hist-card';
  card.dataset.histDate = dateStr;

  // top row
  const top  = document.createElement('div'); top.className = 'hist-card-top';
  const dcol = document.createElement('div'); dcol.className = 'hist-date-col';
  const dateEl = document.createElement('div'); dateEl.className = 'hist-date';
  dateEl.textContent = (isToday ? 'Today, ' : '') + mo + ' ' + day;
  const wdEl   = document.createElement('div'); wdEl.className = 'hist-weekday';
  wdEl.textContent = wd.toUpperCase() + ' \xb7 ' + entry.dayName;
  dcol.appendChild(dateEl); dcol.appendChild(wdEl);

  const badge = document.createElement('span'); badge.className = 'hist-badge b-' + entry.type;
  badge.style.background = 'color-mix(in srgb, ' + color + ' 12%, transparent)';
  badge.style.color       = color;
  badge.style.border      = '1px solid color-mix(in srgb, ' + color + ' 28%, transparent)';
  badge.textContent = entry.label.toUpperCase();

  const pcol = document.createElement('div'); pcol.className = 'hist-progress-col';
  if (entry.type !== 'rest') {
    const frac = document.createElement('div');
    frac.className = 'hist-fraction' + (entry.doneSets >= entry.totalSets ? ' full' : '');
    frac.textContent = entry.doneSets + '/' + entry.totalSets;
    const barWrap = document.createElement('div'); barWrap.className = 'hist-bar-wrap';
    const barFill = document.createElement('div'); barFill.className = 'hist-bar-fill';
    barFill.style.width  = (entry.totalSets ? Math.round((entry.doneSets/entry.totalSets)*100) : 0) + '%';
    barFill.style.background = color;
    barWrap.appendChild(barFill);
    pcol.appendChild(frac); pcol.appendChild(barWrap);
  } else {
    const frac = document.createElement('div'); frac.className = 'hist-fraction';
    frac.textContent = entry.doneRec + '/' + entry.totalRec;
    pcol.appendChild(frac);
  }

  top.appendChild(dcol); top.appendChild(badge); top.appendChild(pcol);
  card.appendChild(top);

  // exercises detail (shown on expand)
  if (entry.type !== 'rest' && entry.exercises && entry.exercises.length > 0) {
    const exList = document.createElement('div'); exList.className = 'hist-exercises';
    entry.exercises.forEach(ex => {
      const row  = document.createElement('div'); row.className = 'hist-ex-row';
      const name = document.createElement('div'); name.className = 'hist-ex-name'; name.textContent = ex.name;
      const meta = document.createElement('div'); meta.style.display = 'flex'; meta.style.alignItems = 'center';
      const sets = document.createElement('div');
      sets.className = 'hist-ex-sets' + (ex.done >= ex.sets ? ' full' : '');
      sets.textContent = ex.done + '/' + ex.sets + ' sets';
      meta.appendChild(sets);
      if (ex.weight) {
        const wt = document.createElement('div'); wt.className = 'hist-ex-wt'; wt.textContent = ex.weight;
        meta.appendChild(wt);
      }
      row.appendChild(name); row.appendChild(meta);
      exList.appendChild(row);
    });
    card.appendChild(exList);

    // toggle expand on tap
    card.addEventListener('click', () => card.classList.toggle('expanded'));
  }

  return card;
}

function calcStreak(sortedDates) {
  if (!sortedDates.length) return 0;
  let streak = 0;
  const today = new Date(TODAY_STR + 'T12:00:00');
  for (let i = 0; i < sortedDates.length; i++) {
    const d    = new Date(sortedDates[i] + 'T12:00:00');
    const diff = Math.round((today - d) / 86400000);
    if (diff === i) streak++;
    else break;
  }
  return streak;
}

// ═══════════════════════════════════════════════════════════════
//  COACH (AI Personal Trainer — Google Gemini)
// ═══════════════════════════════════════════════════════════════

const COACH_KEY_STORE  = 'wt-coach-key';
const COACH_MSGS_STORE = 'wt-coach-msgs';

function coachGetKey()  { return lsGet(COACH_KEY_STORE) || ''; }
function coachSaveKey(k){ lsSet(COACH_KEY_STORE, k); }
function coachGetMsgs() { return lsGet(COACH_MSGS_STORE) || []; }
function coachSaveMsgs(m){ lsSet(COACH_MSGS_STORE, m); }

function buildCoachSystemPrompt() {
  const day = workouts[TODAY_IDX];
  const todayC = completions[TODAY_STR] || {};
  const history = lsGet('wt-history') || {};
  const recentSessions = Object.values(history)
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0, 5);

  let prompt = `You are a knowledgeable, encouraging personal trainer built into a workout tracking app. You know the user's full workout plan, their current weights, and their recent history. Be concise, specific, and practical. Use the data you have to give personalized advice.\n\n`;

  prompt += `TODAY (${TODAY_STR}) — ${day.dayName} — ${day.type.toUpperCase()} DAY\n`;
  if (day.type !== 'rest' && day.exercises) {
    day.exercises.forEach(ex => {
      const done = Math.min(todayC[ex.id] || 0, ex.sets);
      prompt += `  • ${ex.name}: ${ex.sets}×${ex.reps} @ ${ex.weight || 'bodyweight'} — ${done}/${ex.sets} sets done\n`;
    });
  } else {
    prompt += `  Rest/recovery day\n`;
  }

  if (recentSessions.length > 0) {
    prompt += `\nRECENT SESSIONS (last ${recentSessions.length}):\n`;
    recentSessions.forEach(s => {
      prompt += `  ${s.date} — ${s.type?.toUpperCase()} — ${s.doneSets||0}/${s.totalSets||0} sets\n`;
      if (s.exercises) {
        s.exercises.forEach(ex => {
          if (ex.done > 0) prompt += `    • ${ex.name}: ${ex.weight || 'bw'} (${ex.done}/${ex.sets} sets)\n`;
        });
      }
    });
  }

  const week = (lsGet('wt-calc-week') || 1);
  const phase = week <= 3 ? 'Foundation' : week <= 7 ? 'Progression' : 'Peak/Deload';
  prompt += `\nTRAINING WEEK: ${week} — Phase: ${phase}\n`;
  prompt += `\nFULL WEEKLY PLAN:\n`;
  workouts.forEach((w, i) => {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    prompt += `  ${days[i]} — ${w.label} (${w.type})\n`;
    if (w.exercises) w.exercises.forEach(ex => {
      prompt += `    • ${ex.name}: ${ex.sets}×${ex.reps} @ ${ex.weight || 'bw'}\n`;
    });
  });

  return prompt;
}

function renderCoach() {
  const container = document.getElementById('coachView');
  container.innerHTML = '';

  const key = coachGetKey();
  if (!key) {
    renderCoachSetup(container);
    return;
  }
  renderCoachChat(container, key);
}

function renderCoachSetup(container) {
  const wrap = document.createElement('div'); wrap.className = 'coach-setup';

  const title = document.createElement('div'); title.className = 'coach-setup-title';
  title.textContent = 'AI Coach';
  wrap.appendChild(title);

  const sub = document.createElement('div'); sub.className = 'coach-setup-sub';
  sub.textContent = 'Enter your Google Gemini API key\nto activate your personal trainer.\nFree at aistudio.google.com';
  wrap.appendChild(sub);

  const inp = document.createElement('input');
  inp.type = 'password'; inp.className = 'coach-key-inp';
  inp.placeholder = 'AIza...';
  wrap.appendChild(inp);

  const btn = document.createElement('button'); btn.className = 'coach-save-btn';
  btn.textContent = 'ACTIVATE COACH';
  btn.addEventListener('click', () => {
    const val = inp.value.trim();
    if (!val) return;
    coachSaveKey(val);
    renderCoach();
  });
  wrap.appendChild(btn);

  container.appendChild(wrap);
  inp.focus();
}

function renderCoachChat(container, key) {
  // header
  const header = document.createElement('div'); header.className = 'coach-header';
  const title = document.createElement('div'); title.className = 'coach-title';
  title.textContent = 'AI COACH';
  header.appendChild(title);

  const headerBtns = document.createElement('div');
  headerBtns.style.cssText = 'display:flex;gap:6px';

  const changeKeyBtn = document.createElement('button'); changeKeyBtn.className = 'coach-clear-btn';
  changeKeyBtn.textContent = 'Change Key';
  changeKeyBtn.addEventListener('click', () => { coachSaveKey(''); coachSaveMsgs([]); renderCoach(); });
  headerBtns.appendChild(changeKeyBtn);

  const clearBtn = document.createElement('button'); clearBtn.className = 'coach-clear-btn';
  clearBtn.textContent = 'Clear Chat';
  clearBtn.addEventListener('click', () => { coachSaveMsgs([]); renderCoach(); });
  headerBtns.appendChild(clearBtn);

  header.appendChild(headerBtns);
  container.appendChild(header);

  // messages area
  const msgsEl = document.createElement('div'); msgsEl.className = 'coach-msgs';
  container.appendChild(msgsEl);

  const msgs = coachGetMsgs();
  if (msgs.length === 0) {
    renderCoachEmpty(msgsEl);
  } else {
    msgs.forEach(m => appendCoachBubble(msgsEl, m.role, m.text));
    setTimeout(() => { msgsEl.scrollTop = msgsEl.scrollHeight; }, 0);
  }

  // input bar
  const bar = document.createElement('div'); bar.className = 'coach-input-bar';
  const inp = document.createElement('textarea'); inp.className = 'coach-inp';
  inp.placeholder = 'Ask your coach anything...'; inp.rows = 1;
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  const sendBtn = document.createElement('button'); sendBtn.className = 'coach-send-btn';
  sendBtn.innerHTML = '&#9650;';
  sendBtn.addEventListener('click', sendMsg);

  bar.appendChild(inp);
  bar.appendChild(sendBtn);
  container.appendChild(bar);

  function sendMsg() {
    const text = inp.value.trim();
    if (!text || sendBtn.disabled) return;
    inp.value = ''; inp.style.height = 'auto'; sendBtn.disabled = true;

    // remove empty state
    const emptyEl = msgsEl.querySelector('.coach-empty');
    if (emptyEl) emptyEl.remove();

    const allMsgs = coachGetMsgs();
    allMsgs.push({ role: 'user', text });
    coachSaveMsgs(allMsgs);
    appendCoachBubble(msgsEl, 'user', text);

    // typing indicator
    const typingEl = document.createElement('div'); typingEl.className = 'coach-msg ai';
    const typingBubble = document.createElement('div'); typingBubble.className = 'coach-typing';
    for (let i = 0; i < 3; i++) { const s = document.createElement('span'); typingBubble.appendChild(s); }
    typingEl.appendChild(typingBubble);
    msgsEl.appendChild(typingEl);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    // build messages array for Groq (OpenAI-compatible format)
    const groqMessages = [{ role: 'system', content: buildCoachSystemPrompt() }];
    coachGetMsgs().forEach(m => {
      groqMessages.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text });
    });

    fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: 'llama-3.1-8b-instant',
        messages: groqMessages,
        max_tokens: 512,
        temperature: 0.7,
      }),
    })
    .then(r => r.json())
    .then(data => {
      typingEl.remove();
      sendBtn.disabled = false;
      const reply = data?.choices?.[0]?.message?.content;
      if (reply) {
        const saved = coachGetMsgs();
        saved.push({ role: 'ai', text: reply });
        coachSaveMsgs(saved);
        appendCoachBubble(msgsEl, 'ai', reply);
      } else {
        const errMsg = data?.error?.message || 'No response. Check your API key.';
        appendCoachBubble(msgsEl, 'ai', '⚠️ ' + errMsg);
      }
      msgsEl.scrollTop = msgsEl.scrollHeight;
    })
    .catch(() => {
      typingEl.remove();
      sendBtn.disabled = false;
      appendCoachBubble(msgsEl, 'ai', '⚠️ Network error. Check your connection.');
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
  }

  inp.focus();
}

function renderCoachEmpty(msgsEl) {
  const wrap = document.createElement('div'); wrap.className = 'coach-empty';
  const icon = document.createElement('div'); icon.className = 'coach-empty-icon';
  icon.textContent = '🤖';
  const txt = document.createElement('div'); txt.className = 'coach-empty-text';
  txt.textContent = "Your AI coach knows your plan,\nyour weights, and your history.\nAsk anything.";
  wrap.appendChild(icon); wrap.appendChild(txt);

  const sugs = document.createElement('div'); sugs.className = 'coach-suggestions';
  const suggestions = [
    "Should I deload this week?",
    "What muscles am I neglecting?",
    "Shoulder hurts on bench — alternatives?",
    "Am I progressing fast enough?",
  ];
  suggestions.forEach(s => {
    const btn = document.createElement('button'); btn.className = 'coach-sug-btn';
    btn.textContent = s;
    btn.addEventListener('click', () => {
      const bar = document.querySelector('.coach-inp');
      if (bar) { bar.value = s; bar.dispatchEvent(new Event('input')); bar.focus(); }
    });
    sugs.appendChild(btn);
  });
  wrap.appendChild(sugs);
  msgsEl.appendChild(wrap);
}

function appendCoachBubble(msgsEl, role, text) {
  const msg = document.createElement('div');
  msg.className = 'coach-msg ' + (role === 'user' ? 'user' : 'ai');

  const label = document.createElement('div'); label.className = 'coach-bubble-label';
  label.textContent = role === 'user' ? 'You' : 'Coach';
  msg.appendChild(label);

  const bubble = document.createElement('div'); bubble.className = 'coach-bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);

  msgsEl.appendChild(msg);
}
