function buildHistCard(dateStr, entry) {
  const color = TYPE_COLOR[entry.type] || '#C9A84C';
  const d     = new Date(dateStr + 'T12:00:00');
  const day   = d.getDate();
  const mo    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  const wd    = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];

  const isToday = dateStr === TODAY_STR;
  const card    = document.createElement('div'); card.className = 'hist-card';
  card.dataset.histDate = dateStr;

  // top row
  const top  = document.createElement('div'); top.className = 'hist-card-top';
  const dcol = document.createElement('div'); dcol.className = 'hist-date-col';
  const dateEl = document.createElement('div'); dateEl.className = 'hist-date';
  dateEl.textContent = (isToday ? 'Today, ' : '') + mo + ' ' + day;
  const wdEl   = document.createElement('div'); wdEl.className = 'hist-weekday';
  wdEl.textContent = wd.toUpperCase() + ' \xb7 ' + entry.dayName;
  dcol.appendChild(dateEl); dcol.appendChild(wdEl);

  const badge = document.createElement('span'); badge.className = 'hist-badge b-' + entry.type;
  badge.style.background = 'color-mix(in srgb, ' + color + ' 12%, transparent)';
  badge.style.color       = color;
  badge.style.border      = '1px solid color-mix(in srgb, ' + color + ' 28%, transparent)';
  badge.textContent = entry.label.toUpperCase();

  const pcol = document.createElement('div'); pcol.className = 'hist-progress-col';
  if (entry.type !== 'rest') {
    const frac = document.createElement('div');
    frac.className = 'hist-fraction' + (entry.doneSets >= entry.totalSets ? ' full' : '');
    frac.textContent = entry.doneSets + '/' + entry.totalSets;
    const barWrap = document.createElement('div'); barWrap.className = 'hist-bar-wrap';
    const barFill = document.createElement('div'); barFill.className = 'hist-bar-fill';
    barFill.style.width  = (entry.totalSets ? Math.round((entry.doneSets/entry.totalSets)*100) : 0) + '%';
    barFill.style.background = color;
    barWrap.appendChild(barFill);
    pcol.appendChild(frac); pcol.appendChild(barWrap);
  } else {
    const frac = document.createElement('div'); frac.className = 'hist-fraction';
    frac.textContent = entry.doneRec + '/' + entry.totalRec;
    pcol.appendChild(frac);
  }

  top.appendChild(dcol); top.appendChild(badge); top.appendChild(pcol);
  card.appendChild(top);

  // exercises detail (shown on expand)
  if (entry.type !== 'rest' && entry.exercises && entry.exercises.length > 0) {
    const exList = document.createElement('div'); exList.className = 'hist-exercises';
    let editing = false;

    function rebuildExRows() {
      exList.textContent = '';
      const history = lsGet('wt-history') || {};
      const current = history[dateStr];
      if (!current) return;

      current.exercises.forEach((ex, idx) => {
        const row  = document.createElement('div'); row.className = 'hist-ex-row';
        const name = document.createElement('div'); name.className = 'hist-ex-name'; name.textContent = ex.name;
        const meta = document.createElement('div'); meta.style.cssText = 'display:flex;align-items:center;gap:6px';

        if (editing) {
          // editable sets done
          const setsInp = document.createElement('input'); setsInp.type = 'number';
          setsInp.className = 'hist-ex-sets-inp'; setsInp.value = ex.done;
          setsInp.min = '0'; setsInp.max = ex.sets;
          setsInp.addEventListener('change', () => {
            const h = lsGet('wt-history') || {};
            h[dateStr].exercises[idx].done = Math.max(0, Math.min(ex.sets, parseInt(setsInp.value)||0));
            // recalc doneSets
            h[dateStr].doneSets = h[dateStr].exercises.reduce((a,e) => a + (e.done||0), 0);
            lsSet('wt-history', h); scheduleSyncToGist();
          });
          const setsLbl = document.createElement('span'); setsLbl.className = 'hist-ex-sets';
          setsLbl.textContent = '/' + ex.sets;

          // editable weight
          const wtInp = document.createElement('input'); wtInp.type = 'text';
          wtInp.className = 'hist-ex-inp'; wtInp.value = ex.weight || '';
          wtInp.placeholder = 'weight';
          wtInp.addEventListener('change', () => {
            const h = lsGet('wt-history') || {};
            h[dateStr].exercises[idx].weight = wtInp.value.trim();
            lsSet('wt-history', h); scheduleSyncToGist();
          });

          // delete exercise
          const delBtn = document.createElement('button'); delBtn.className = 'hist-ex-del';
          delBtn.textContent = '×';
          delBtn.addEventListener('click', e => {
            e.stopPropagation();
            const h = lsGet('wt-history') || {};
            h[dateStr].exercises.splice(idx, 1);
            h[dateStr].totalSets = h[dateStr].exercises.reduce((a,e2) => a + (e2.sets||0), 0);
            h[dateStr].doneSets  = h[dateStr].exercises.reduce((a,e2) => a + (e2.done||0), 0);
            lsSet('wt-history', h); scheduleSyncToGist();
            rebuildExRows();
          });

          meta.appendChild(setsInp); meta.appendChild(setsLbl); meta.appendChild(wtInp);
          row.appendChild(name); row.appendChild(meta); row.appendChild(delBtn);
        } else {
          const sets = document.createElement('div');
          sets.className = 'hist-ex-sets' + (ex.done >= ex.sets ? ' full' : '');
          sets.textContent = ex.done + '/' + ex.sets + ' sets';
          meta.appendChild(sets);
          if (ex.weight) {
            const wt = document.createElement('div'); wt.className = 'hist-ex-wt'; wt.textContent = ex.weight;
            meta.appendChild(wt);
          }
          row.appendChild(name); row.appendChild(meta);
        }
        exList.appendChild(row);
      });

      // add exercise row (edit mode only)
      if (editing) {
        const addRow = document.createElement('div'); addRow.className = 'hist-add-ex-row';
        const nameInp = document.createElement('input'); nameInp.className = 'hist-add-ex-inp';
        nameInp.placeholder = 'Exercise name';
        const wtInp = document.createElement('input'); wtInp.type = 'text';
        wtInp.className = 'hist-ex-inp'; wtInp.placeholder = 'weight'; wtInp.style.width = '70px';
        const addBtn = document.createElement('button'); addBtn.className = 'hist-add-btn';
        addBtn.textContent = '+ Add';
        addBtn.addEventListener('click', () => {
          const n = nameInp.value.trim(); if (!n) return;
          const h = lsGet('wt-history') || {};
          const newEx = { id: Date.now(), name: n, sets: 1, reps: 1, done: 1, weight: wtInp.value.trim() };
          h[dateStr].exercises.push(newEx);
          h[dateStr].totalSets = h[dateStr].exercises.reduce((a,e) => a + (e.sets||0), 0);
          h[dateStr].doneSets  = h[dateStr].exercises.reduce((a,e) => a + (e.done||0), 0);
          lsSet('wt-history', h); scheduleSyncToGist();
          nameInp.value = ''; wtInp.value = '';
          rebuildExRows();
        });
        addRow.appendChild(nameInp); addRow.appendChild(wtInp); addRow.appendChild(addBtn);
        exList.appendChild(addRow);
      }

      // action buttons
      const actions = document.createElement('div'); actions.className = 'hist-card-actions';

      const editToggle = document.createElement('button'); editToggle.className = 'hist-action-btn';
      editToggle.textContent = editing ? 'Done Editing' : 'Edit Session';
      editToggle.addEventListener('click', e => {
        e.stopPropagation(); editing = !editing; rebuildExRows();
      });
      actions.appendChild(editToggle);

      if (!editing) {
        const delSession = document.createElement('button'); delSession.className = 'hist-action-btn danger';
        delSession.textContent = 'Delete Session';
        delSession.addEventListener('click', e => {
          e.stopPropagation();
          const h = lsGet('wt-history') || {};
          delete h[dateStr];
          lsSet('wt-history', h); scheduleSyncToGist();
          card.remove();
        });
        actions.appendChild(delSession);
      }
      exList.appendChild(actions);
    }

    rebuildExRows();
    card.appendChild(exList);
    card.addEventListener('click', () => card.classList.toggle('expanded'));
  }

  return card;
}

function calcStreak(sortedDates) {
  if (!sortedDates.length) return 0;
  let streak = 0;
  const today = new Date(TODAY_STR + 'T12:00:00');
  for (let i = 0; i < sortedDates.length; i++) {
    const d    = new Date(sortedDates[i] + 'T12:00:00');
    const diff = Math.round((today - d) / 86400000);
    if (diff === i) streak++;
    else break;
  }
  return streak;
}

// ═══════════════════════════════════════════════════════════════
//  COACH (AI Personal Trainer — Groq)
// ═══════════════════════════════════════════════════════════════

const COACH_MODEL          = 'openai/gpt-oss-20b';
const COACH_KEY_STORE      = 'wt-coach-key';
const COACH_MSGS_STORE     = 'wt-coach-msgs';     // legacy — migration only
const COACH_SESSIONS_STORE = 'wt-coach-sessions';

function coachGetKey()   { return lsGet(COACH_KEY_STORE) || ''; }
function coachSaveKey(k) { lsSet(COACH_KEY_STORE, k); }

function coachGetSessions() {
  const stored = lsGet(COACH_SESSIONS_STORE);
  if (stored !== null) return stored;
  // First launch — migrate legacy wt-coach-msgs if present
  const legacy = lsGet(COACH_MSGS_STORE) || [];
  const initial = [];
  if (legacy.length > 0) {
    initial.push({
      id: 'session_' + Date.now(),
      createdAt: new Date().toISOString(),
      preview: legacy.find(m => m.role === 'user')?.text?.slice(0, 60) || 'Previous chat',
      messages: legacy,
    });
    localStorage.removeItem(COACH_MSGS_STORE);
  }
  lsSet(COACH_SESSIONS_STORE, initial);
  return initial;
}
function coachSaveSessions(s) { lsSet(COACH_SESSIONS_STORE, s); }
function coachGetSession(id)  { return coachGetSessions().find(s => s.id === id) || null; }
function coachUpdateSession(id, updates) {
  const all = coachGetSessions(), idx = all.findIndex(s => s.id === id);
  if (idx === -1) return;
  Object.assign(all[idx], updates);
  coachSaveSessions(all);
}

function formatSessionDate(isoStr) {
  const d = new Date(isoStr), now = new Date();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString())
    return 'Today · ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return DAYS_S[d.getDay()] + ', ' + MONTHS_S[d.getMonth()] + ' ' + d.getDate();
}

function buildCoachSystemPrompt() {
  const day = workouts[TODAY_IDX];
  const todayC = completions[TODAY_STR] || {};
  const history = lsGet('wt-history') || {};
  const recentSessions = Object.values(history)
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0, 5);

  let prompt = `You are a knowledgeable, encouraging personal trainer built into a workout tracking app. You know the user's full workout plan, their current weights, and their recent history. Be concise, specific, and practical. Use the data you have to give personalized advice.\n\n`;

  // The app's plan decides weights and deloads (planFor). The Coach explains them.
  prompt += `WEIGHTS — IMPORTANT: The app's 12-week plan decides working weights and deload weeks. Each exercise below lists the plan's target for this week and the reason. When asked what weight to use, give that target and its reason in your own words. Do not invent different numbers. The app records completed sets but not reps, so you cannot know whether the user reached the top of their rep range — ask. If they did not, the plan's rule is to stay at their current weight (double progression). If they want to deviate, explain the tradeoff and leave the choice to them.\n\n`;

  prompt += `TODAY (${TODAY_STR}) — ${day.dayName} — ${day.type.toUpperCase()} DAY\n`;
  if (day.type !== 'rest' && day.exercises) {
    day.exercises.forEach(ex => {
      const done = Math.min(todayC[ex.id] || 0, ex.sets);
      const plan = planFor(ex.name);
      prompt += `  • ${ex.name}: ${ex.sets}×${ex.reps} @ ${ex.weight || 'bodyweight'} — ${done}/${ex.sets} sets done`;
      prompt += plan ? ` — plan target ${fmtW(plan.target)} (${plan.why})\n` : `\n`;
    });
  } else {
    prompt += `  Rest/recovery day\n`;
  }

  if (recentSessions.length > 0) {
    prompt += `\nRECENT SESSIONS (last ${recentSessions.length}):\n`;
    recentSessions.forEach(s => {
      prompt += `  ${s.date} — ${s.type?.toUpperCase()} — ${s.doneSets||0}/${s.totalSets||0} sets\n`;
      if (s.exercises) {
        s.exercises.forEach(ex => {
          if (ex.done > 0) prompt += `    • ${ex.name}: ${ex.weight || 'bw'} (${ex.done}/${ex.sets} sets)\n`;
        });
      }
    });
  }

  const wi = weekInfo(calcWeek);
  prompt += `\nTRAINING WEEK: ${wi.week} of 12 — Phase ${wi.phase.n} (${wi.phase.name}: ${wi.phase.aim})${wi.deload ? ' — DELOAD WEEK, 65% of working weight' : ''}\n`;
  prompt += `\nFULL WEEKLY PLAN:\n`;
  workouts.forEach((w, i) => {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    prompt += `  ${days[i]} — ${w.label} (${w.type})\n`;
    if (w.exercises) w.exercises.forEach(ex => {
      prompt += `    • ${ex.name}: ${ex.sets}×${ex.reps} @ ${ex.weight || 'bw'}\n`;
    });
  });

  return prompt;
}

function renderCoach() {
  const container = document.getElementById('coachView');
  container.innerHTML = '';
  const key = coachGetKey();
  if (!key) { renderCoachSetup(container); return; }
  if (coachActiveSessionId) renderCoachChat(container, key);
  else renderCoachList(container, key);
}

function renderCoachSetup(container) {
  const wrap = document.createElement('div'); wrap.className = 'coach-setup';

  const title = document.createElement('div'); title.className = 'coach-setup-title';
  title.textContent = 'AI Coach';
  wrap.appendChild(title);

  const sub = document.createElement('div'); sub.className = 'coach-setup-sub';
  sub.textContent = 'Enter your Groq API key to\nactivate your personal trainer.\nFree at console.groq.com';
  wrap.appendChild(sub);

  const inp = document.createElement('input');
  inp.type = 'password'; inp.className = 'coach-key-inp';
  inp.placeholder = 'gsk_...';
  wrap.appendChild(inp);

  const btn = document.createElement('button'); btn.className = 'coach-save-btn';
  btn.textContent = 'ACTIVATE COACH';
  btn.addEventListener('click', () => {
    const val = inp.value.trim(); if (!val) return;
    coachSaveKey(val); renderCoach();
  });
  wrap.appendChild(btn);
  container.appendChild(wrap);
  inp.focus();
}

function renderCoachList(container, key) {
  // header
  const header = document.createElement('div'); header.className = 'coach-header';
  const title = document.createElement('div'); title.className = 'coach-title';
  title.textContent = 'AI COACH';
  header.appendChild(title);

  const changeKeyBtn = document.createElement('button'); changeKeyBtn.className = 'coach-clear-btn';
  changeKeyBtn.textContent = 'Change Key';
  changeKeyBtn.addEventListener('click', () => { coachSaveKey(''); renderCoach(); });
  header.appendChild(changeKeyBtn);
  container.appendChild(header);

  // scrollable list body
  const list = document.createElement('div'); list.className = 'coach-list';

  // new chat button
  const newBtn = document.createElement('button'); newBtn.className = 'coach-new-btn';
  newBtn.textContent = '+ New Chat';
  newBtn.addEventListener('click', () => {
    coachActiveSessionId = 'new';
    renderCoach();
  });
  list.appendChild(newBtn);

  const sessions = coachGetSessions();
  if (sessions.length === 0) {
    const empty = document.createElement('div'); empty.className = 'coach-list-empty';
    const ico = document.createElement('div'); ico.className = 'coach-empty-icon'; ico.textContent = '🤖';
    const txt = document.createElement('div'); txt.className = 'coach-empty-text';
    txt.textContent = 'No chats yet.\nTap New Chat to get started.';
    empty.appendChild(ico); empty.appendChild(txt);
    list.appendChild(empty);
  } else {
    sessions.forEach(session => {
      const item = document.createElement('div'); item.className = 'coach-session-item';

      const info = document.createElement('div'); info.className = 'coach-session-info';
      const dateEl = document.createElement('div'); dateEl.className = 'coach-session-date';
      dateEl.textContent = formatSessionDate(session.createdAt);
      const prev = document.createElement('div'); prev.className = 'coach-session-preview';
      prev.textContent = session.preview || 'Empty chat';
      info.appendChild(dateEl); info.appendChild(prev);

      const del = document.createElement('button'); del.className = 'coach-session-del';
      del.textContent = '✕';
      del.addEventListener('click', e => {
        e.stopPropagation();
        coachSaveSessions(coachGetSessions().filter(s => s.id !== session.id));
        renderCoach();
      });

      item.appendChild(info); item.appendChild(del);
      item.addEventListener('click', () => { coachActiveSessionId = session.id; renderCoach(); });
      list.appendChild(item);
    });
  }

  container.appendChild(list);
}

function renderCoachChat(container, key) {
  const sessionId = coachActiveSessionId;
  // for a brand-new chat, messages come from an in-memory array until first save
  let liveMsgs = sessionId === 'new' ? [] : (coachGetSession(sessionId)?.messages || []);

  // header
  const header = document.createElement('div'); header.className = 'coach-header';

  const backBtn = document.createElement('button'); backBtn.className = 'coach-back-btn';
  backBtn.textContent = '← Back';
  backBtn.addEventListener('click', () => { coachActiveSessionId = null; renderCoach(); });
  header.appendChild(backBtn);

  const headerBtns = document.createElement('div'); headerBtns.style.cssText = 'display:flex;gap:6px';
  const clearBtn = document.createElement('button'); clearBtn.className = 'coach-clear-btn';
  clearBtn.textContent = 'Clear';
  clearBtn.addEventListener('click', () => {
    if (sessionId !== 'new') coachUpdateSession(sessionId, { messages: [], preview: '' });
    liveMsgs = [];
    msgsEl.innerHTML = '';
    renderCoachEmpty(msgsEl);
  });
  headerBtns.appendChild(clearBtn);
  header.appendChild(headerBtns);
  container.appendChild(header);

  // messages area
  const msgsEl = document.createElement('div'); msgsEl.className = 'coach-msgs';
  container.appendChild(msgsEl);

  if (liveMsgs.length === 0) {
    renderCoachEmpty(msgsEl);
  } else {
    liveMsgs.forEach(m => appendCoachBubble(msgsEl, m.role, m.text));
    setTimeout(() => { msgsEl.scrollTop = msgsEl.scrollHeight; }, 0);
  }

  // input bar
  const bar = document.createElement('div'); bar.className = 'coach-input-bar';
  const inp = document.createElement('textarea'); inp.className = 'coach-inp';
  inp.placeholder = 'Ask your coach anything...'; inp.rows = 1;
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  const sendBtn = document.createElement('button'); sendBtn.className = 'coach-send-btn';
  sendBtn.innerHTML = '&#9650;';
  sendBtn.addEventListener('click', sendMsg);
  bar.appendChild(inp); bar.appendChild(sendBtn);
  container.appendChild(bar);

  function saveToSession(msgs) {
    const preview = msgs.find(m => m.role === 'user')?.text?.slice(0, 60) || '';
    if (coachActiveSessionId === 'new') {
      const newSession = {
        id: 'session_' + Date.now(),
        createdAt: new Date().toISOString(),
        preview,
        messages: msgs,
      };
      const all = coachGetSessions();
      all.unshift(newSession);
      coachSaveSessions(all);
      coachActiveSessionId = newSession.id;
    } else {
      coachUpdateSession(coachActiveSessionId, { messages: msgs, preview });
    }
  }

  function sendMsg() {
    const text = inp.value.trim();
    if (!text || sendBtn.disabled) return;
    inp.value = ''; inp.style.height = 'auto'; sendBtn.disabled = true;

    const emptyEl = msgsEl.querySelector('.coach-empty');
    if (emptyEl) emptyEl.remove();

    liveMsgs.push({ role: 'user', text });
    saveToSession(liveMsgs);
    appendCoachBubble(msgsEl, 'user', text);

    // typing indicator
    const typingEl = document.createElement('div'); typingEl.className = 'coach-msg ai';
    const typingBubble = document.createElement('div'); typingBubble.className = 'coach-typing';
    for (let i = 0; i < 3; i++) { const s = document.createElement('span'); typingBubble.appendChild(s); }
    typingEl.appendChild(typingBubble);
    msgsEl.appendChild(typingEl);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    const groqMessages = [{ role: 'system', content: buildCoachSystemPrompt() }];
    liveMsgs.forEach(m => {
      groqMessages.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text });
    });

    fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      // llama-3.1-8b-instant was shut down by Groq on 2026-08-16; gpt-oss-20b is their named replacement.
      // It's a reasoning model: reasoning tokens count toward the completion limit, so keep effort
      // low and leave headroom, and don't return the reasoning — only the answer is shown.
      body: JSON.stringify({
        model: COACH_MODEL, messages: groqMessages, temperature: 0.7,
        max_completion_tokens: 1536, reasoning_effort: 'low', include_reasoning: false,
      }),
    })
    .then(r => r.json())
    .then(data => {
      typingEl.remove(); sendBtn.disabled = false;
      const reply = data?.choices?.[0]?.message?.content;
      if (reply) {
        liveMsgs.push({ role: 'ai', text: reply });
        saveToSession(liveMsgs);
        appendCoachBubble(msgsEl, 'ai', reply);
      } else {
        appendCoachBubble(msgsEl, 'ai', '⚠️ ' + (data?.error?.message || 'No response. Check your API key.'));
      }
      msgsEl.scrollTop = msgsEl.scrollHeight;
    })
    .catch(() => {
      typingEl.remove(); sendBtn.disabled = false;
      appendCoachBubble(msgsEl, 'ai', '⚠️ Network error. Check your connection.');
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
  }

  inp.focus();
}

function renderCoachEmpty(msgsEl) {
  const wrap = document.createElement('div'); wrap.className = 'coach-empty';
  const icon = document.createElement('div'); icon.className = 'coach-empty-icon'; icon.textContent = '🤖';
  const txt = document.createElement('div'); txt.className = 'coach-empty-text';
  txt.textContent = "Your AI coach knows your plan,\nyour weights, and your history.\nAsk anything.";
  wrap.appendChild(icon); wrap.appendChild(txt);

  const sugs = document.createElement('div'); sugs.className = 'coach-suggestions';
  ['Should I deload this week?', 'What muscles am I neglecting?',
   'Shoulder hurts on bench — alternatives?', 'Am I progressing fast enough?'].forEach(s => {
    const btn = document.createElement('button'); btn.className = 'coach-sug-btn';
    btn.textContent = s;
    btn.addEventListener('click', () => {
      const bar = document.querySelector('.coach-inp');
      if (bar) { bar.value = s; bar.dispatchEvent(new Event('input')); bar.focus(); }
    });
    sugs.appendChild(btn);
  });
  wrap.appendChild(sugs);
  msgsEl.appendChild(wrap);
}

function appendCoachBubble(msgsEl, role, text) {
  const msg = document.createElement('div');
  msg.className = 'coach-msg ' + (role === 'user' ? 'user' : 'ai');
  const label = document.createElement('div'); label.className = 'coach-bubble-label';
  label.textContent = role === 'user' ? 'You' : 'Coach';
  const bubble = document.createElement('div'); bubble.className = 'coach-bubble';
  bubble.textContent = text;
  msg.appendChild(label); msg.appendChild(bubble);
  msgsEl.appendChild(msg);
}
