function renderMain() {
  const day  = workouts[viewDay];
  const main = document.getElementById('main');
  const fab  = document.getElementById('fabWrap');
  main.textContent = '';

  if (day.type === 'rest') {
    fab.style.display = 'none';
    renderRestDay(main, day);
  } else {
    fab.style.display = 'flex';
    renderWorkoutDay(main, day);
  }
}

// ─── workout day ────────────────────────────────────────────────

function renderWorkoutDay(container, day) {
  const exs      = day.exercises;
  const totalS   = exs.reduce((a,e) => a+e.sets, 0);
  const doneAll  = exs.length > 0 && exs.every(e => getDone(e.id) >= e.sets);

  container.appendChild(buildOverloadCard());
  const muscleCard = buildMuscleCard(day.type);
  if (muscleCard) container.appendChild(muscleCard);
  if (doneAll) container.appendChild(buildCompleteBanner(exs.length + ' exercises \xb7 ' + totalS + ' total sets'));
  exs.forEach(ex => container.appendChild(buildCard(ex)));
}

function buildCompleteBanner(sub) {
  const wrap = document.createElement('div'); wrap.className = 'complete-banner';
  const t    = document.createElement('div'); t.className = 'complete-title'; t.textContent = 'Workout Complete 🔥';
  const s    = document.createElement('div'); s.className = 'complete-sub';   s.textContent = sub;
  wrap.appendChild(t); wrap.appendChild(s);
  return wrap;
}

// ─── exercise card ──────────────────────────────────────────────

function buildCard(ex) {
  const done    = getDone(ex.id);
  const allDone = done >= ex.sets;
  const editing = editingId === ex.id;

  const card = document.createElement('div');
  card.className = 'ex-card' + (allDone ? ' done' : '');
  card.dataset.card = ex.id;

  // top row
  const top   = document.createElement('div'); top.className = 'card-top';
  const left  = document.createElement('div'); left.className = 'card-left';
  const right = document.createElement('div'); right.className = 'card-right';

  const nameEl = document.createElement('div'); nameEl.className = 'card-name'; nameEl.textContent = ex.name;
  left.appendChild(nameEl);
  if (ex.notes) {
    const noteEl = document.createElement('div'); noteEl.className = 'card-note'; noteEl.textContent = ex.notes;
    left.appendChild(noteEl);
  }

  const srEl = document.createElement('div'); srEl.className = 'card-sr';
  srEl.textContent = ex.sets + '\xd7' + ex.reps;
  const editBtn = document.createElement('button');
  editBtn.className = 'card-edit-btn' + (editing ? ' on' : '');
  editBtn.dataset.tog = ex.id;
  editBtn.textContent = '✏';

  right.appendChild(srEl); right.appendChild(editBtn);
  top.appendChild(left);   top.appendChild(right);
  card.appendChild(top);

  // dots + weight chip row
  const dotsRow = document.createElement('div'); dotsRow.className = 'card-dots';
  for (let i = 0; i < ex.sets; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < done ? ' done' : '');
    dot.dataset.ex = ex.id;
    dot.dataset.i  = String(i);
    dot.textContent = String(i + 1); // CSS hides number via font-size:0 when done
    dotsRow.appendChild(dot);
  }
  const wtCol = document.createElement('div'); wtCol.className = 'wt-col';
  wtCol.appendChild(buildWeightChip(ex));
  dotsRow.appendChild(wtCol);
  card.appendChild(dotsRow);

  // previous session weight — separate row, clearly read-only
  const pw = getPrevWeight(ex.name);
  if (pw) {
    const pwRow = document.createElement('div'); pwRow.className = 'prev-wt-row';
    const pwLabel = document.createElement('span'); pwLabel.className = 'prev-wt-label';
    pwLabel.textContent = 'Last session:';
    const pwVal = document.createElement('span'); pwVal.className = 'prev-wt-val';
    pwVal.textContent = pw;
    pwRow.appendChild(pwLabel); pwRow.appendChild(pwVal);
    card.appendChild(pwRow);
  }

  // what the plan says for this week, and why — from planFor(), never computed here
  const plan = planFor(ex.name);
  if (plan) {
    const row = document.createElement('div'); row.className = 'plan-row' + (plan.deload ? ' is-deload' : '');
    const top = document.createElement('div'); top.className = 'plan-top';
    const lbl = document.createElement('span'); lbl.className = 'plan-lbl';
    lbl.textContent = (plan.deload ? 'Deload' : 'Plan') + ' · wk ' + plan.week;
    const val = document.createElement('span'); val.className = 'plan-val'; val.textContent = fmtW(plan.target);
    top.appendChild(lbl); top.appendChild(val);
    const current = parseFloat(ex.weight);
    if (!(isFinite(current) && Math.abs(current - plan.target) < 0.01)) {
      const use = document.createElement('button'); use.className = 'plan-use';
      use.dataset.usePlan = ex.id; use.textContent = 'Use';
      use.setAttribute('aria-label', 'Set weight to ' + fmtW(plan.target));
      top.appendChild(use);
    }
    const why = document.createElement('div'); why.className = 'plan-why'; why.textContent = plan.why;
    row.appendChild(top); row.appendChild(why);
    card.appendChild(row);
  }

  // REST button
  const restBtn = document.createElement('button');
  restBtn.className = 'rest-btn';
  restBtn.dataset.rest = ex.id;
  if (timer.active && timer.forExId === ex.id) {
    restBtn.classList.add('counting');
    if (timer.secs <= 10) restBtn.classList.add('warn');
  }

  const rIcon = document.createElement('span'); rIcon.className = 'rest-icon'; rIcon.textContent = '⏱';
  const rText = document.createElement('span'); rText.className = 'rest-text';
  rText.textContent = (timer.active && timer.forExId === ex.id)
    ? Math.floor(timer.secs/60) + ':' + String(timer.secs%60).padStart(2,'0')
    : 'REST 90S';
  restBtn.appendChild(rIcon); restBtn.appendChild(rText);

  // edit form first, then rest button always last at bottom
  card.appendChild(editing ? buildEditForm(ex) : (() => { const d = document.createElement('div'); d.className='edit-form'; return d; })());
  card.appendChild(restBtn);

  return card;
}

function buildWeightChip(ex) {
  const chip = document.createElement('div');
  chip.className    = 'wt-chip' + (ex.weight ? ' has-wt' : '');
  chip.dataset.wt   = ex.id;
  chip.textContent  = ex.weight || '— lbs';
  return chip;
}

function buildEditForm(ex) {
  const form = document.createElement('div'); form.className = 'edit-form open';

  function makeRow(fields) {
    const row = document.createElement('div'); row.className = 'ef-row';
    fields.forEach(([key,label,val,extraClass,attrs]) => {
      const col = document.createElement('div');
      col.className = 'ef-col' + (extraClass ? ' '+extraClass : '');
      const lbl = document.createElement('span'); lbl.className='ef-lbl'; lbl.textContent=label;
      const inp = document.createElement('input');
      inp.className='ef-inp'+(attrs&&attrs.mono?' mono':'');
      inp.value=String(val||''); inp.dataset.f=key;
      if (attrs) { if(attrs.type)inp.type=attrs.type; if(attrs.min)inp.min=String(attrs.min); if(attrs.max)inp.max=String(attrs.max); if(attrs.placeholder)inp.placeholder=attrs.placeholder; }
      col.appendChild(lbl); col.appendChild(inp); row.appendChild(col);
    });
    return row;
  }

  form.appendChild(makeRow([['name','Name',ex.name,'x2',{}]]));
  form.appendChild(makeRow([
    ['sets','Sets',ex.sets,'',{type:'number',min:1,max:20,mono:true}],
    ['reps','Reps',ex.reps,'',{mono:true}],
    ['weight','Weight',ex.weight,'',{mono:true,placeholder:'135 lbs'}],
  ]));
  form.appendChild(makeRow([['notes','Notes',ex.notes,'x2',{placeholder:'Optional cue'}]]));

  const acts   = document.createElement('div'); acts.className='ef-actions';
  const btnDel = document.createElement('button'); btnDel.className='btn-del';  btnDel.dataset.del=ex.id; btnDel.textContent='Delete';
  const btnSav = document.createElement('button'); btnSav.className='btn-save'; btnSav.dataset.sv=ex.id;  btnSav.textContent='Save';
  acts.appendChild(btnDel); acts.appendChild(btnSav);
  form.appendChild(acts);
  return form;
}

// ─── rest day ────────────────────────────────────────────────────

function renderRestDay(container, day) {
  const items   = day.recovery || [];
  const isDone  = items.filter(r=>getDone(r.id)).length;
  const allDone = isDone===items.length && items.length>0;
  const isToday = viewDay===TODAY_IDX;

  const hero = document.createElement('div'); hero.className='rest-hero';
  const ico  = document.createElement('div'); ico.className='rest-icon';  ico.textContent='🌿';
  const ttl  = document.createElement('div'); ttl.className='rest-title'; ttl.textContent='FULL REST';
  const sub  = document.createElement('div'); sub.className='rest-sub';   sub.textContent='Recover. Eat. Sleep.';
  hero.appendChild(ico); hero.appendChild(ttl); hero.appendChild(sub);
  container.appendChild(hero);

  if (allDone) container.appendChild(buildCompleteBanner('Recovery complete'));

  // checklist
  items.forEach(r => {
    const done = getDone(r.id);
    const card = document.createElement('div');
    card.className='rec-card'+(done?' done':'');
    card.dataset.rec=r.id;
    if (!isToday) { card.style.cursor='default'; card.style.pointerEvents='none'; }

    const chk = document.createElement('div'); chk.className='rec-check'; if(done) chk.textContent='✓';
    const info= document.createElement('div');
    const nm  = document.createElement('div'); nm.className='rec-name'; nm.textContent=r.name;
    const dur = document.createElement('div'); dur.className='rec-dur';  dur.textContent=r.duration;
    info.appendChild(nm); info.appendChild(dur);
    card.appendChild(chk); card.appendChild(info);
    container.appendChild(card);
  });

  // tip cards
  const tips = [
    {label:'Sleep is Training',  labelClass:'gold', body:'7-9 hours is when growth hormone peaks. This is when your body actually builds muscle.'},
    {label:'Protein Still Matters', labelClass:'gold', body:"Don’t drop intake on rest days. Muscle repairs around the clock."},
    {label:'Recovery Is Training',  labelClass:'rust', body:'Sleep, protein, hydration — the trifecta. Miss any one and you leave gains on the table.'},
  ];
  tips.forEach(t => {
    const card  = document.createElement('div'); card.className='tip-card';
    const label = document.createElement('div'); label.className='tip-label '+t.labelClass; label.textContent=t.label.toUpperCase();
    const body  = document.createElement('div'); body.className='tip-body';   body.textContent=t.body;
    card.appendChild(label); card.appendChild(body);
    container.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════════════
//  EVENT DELEGATION
// ═══════════════════════════════════════════════════════════════

document.getElementById('main').addEventListener('click', e => {
  // set dot
  const dot = e.target.closest('.dot');
  if (dot) {
    const exId=dot.dataset.ex, idx=parseInt(dot.dataset.i), ex=findEx(exId);
    if (!ex) return;
    const cur=getDone(exId), newN=idx<cur?idx:idx+1, wasAll=cur>=ex.sets;
    setDone(exId,newN);
    if (newN>cur && viewDay===TODAY_IDX) startTimer(exId);
    replaceCard(ex,wasAll,newN);
    updateSetsBar();
    return;
  }

  // rest button tap
  const restBtn = e.target.closest('.rest-btn');
  if (restBtn && viewDay===TODAY_IDX) {
    const exId=restBtn.dataset.rest;
    if (timer.active && timer.forExId===exId) stopTimer();
    else startTimer(exId);
    return;
  }

  // edit toggle
  const tog=e.target.closest('[data-tog]');
  if (tog) {
    const id=tog.dataset.tog;
    editingId=editingId===id?null:id;
    renderMain();
    if (editingId) setTimeout(()=>{ const i=document.querySelector('.edit-form.open .ef-inp'); i&&i.focus(); },40);
    return;
  }

  // save / delete
  const sv=e.target.closest('[data-sv]');   if (sv)  { saveEdit(sv.dataset.sv);          return; }
  const del=e.target.closest('[data-del]'); if (del) { deleteExercise(del.dataset.del);   return; }

  // recovery check
  const rec=e.target.closest('[data-rec]');
  if (rec && viewDay===TODAY_IDX) { setDone(rec.dataset.rec, getDone(rec.dataset.rec)?0:1); renderMain(); return; }

  // plan "Use" — set the working weight to this week's target (the user's call, one tap)
  const up=e.target.closest('[data-use-plan]');
  if (up) {
    const ex=findEx(up.dataset.usePlan), plan=ex&&planFor(ex.name);
    if (ex && plan) { ex.weight=fmtW(plan.target); saveAll(); replaceCard(ex, true, getDone(ex.id)); }
    return;
  }

  // weight chip
  const wt=e.target.closest('[data-wt]');
  if (wt && !wt.classList.contains('wt-input')) { inlineEditWeight(wt.dataset.wt,wt); return; }
});

// day pill clicks
document.getElementById('pillsRow').addEventListener('click', e => {
  const pill=e.target.closest('[data-day]');
  if (pill) { goDay(parseInt(pill.dataset.day)); }
});

function replaceCard(ex, wasAll, newCount) {
  const old=document.querySelector('[data-card="'+ex.id+'"]');
  if (!old) { renderMain(); return; }
  const fresh=buildCard(ex); old.replaceWith(fresh);
  if (!wasAll && newCount>=ex.sets) {
    fresh.classList.add('pop');
    navigator.vibrate&&navigator.vibrate([50,25,80]);
    checkWorkoutDone();
  }
}

function checkWorkoutDone() {
  const day=workouts[viewDay];
  if (day.type==='rest') return;
  if (day.exercises.every(e=>getDone(e.id)>=e.sets)) setTimeout(renderMain,360);
}

function updateSetsBar() {
  const day=workouts[viewDay];
  if (day.type==='rest') return;
  const total=day.exercises.reduce((a,e)=>a+e.sets,0);
  const done =day.exercises.reduce((a,e)=>a+Math.min(getDone(e.id),e.sets),0);
  document.getElementById('setsCount').textContent=done+' / '+total;
}

function inlineEditWeight(exId, chip) {
  const ex=findEx(exId); if (!ex) return;
  const inp=document.createElement('input');
  inp.type='text'; inp.className='wt-input'; inp.value=ex.weight||''; inp.placeholder='e.g. 135 lbs';
  chip.replaceWith(inp); inp.focus(); inp.select();
  let committed=false;
  function commit() {
    if (committed) return;           // blur + Enter can both fire
    committed=true;
    ex.weight=inp.value.trim(); saveAll();
    // No direct click listener here — #main already delegates [data-wt],
    // and adding one made every later tap open two editors.
    inp.replaceWith(buildWeightChip(ex));
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();inp.blur();} if(ev.key==='Escape'){inp.value=ex.weight||'';inp.blur();} });
}

// ═══════════════════════════════════════════════════════════════
//  EDIT / DELETE / ADD
// ═══════════════════════════════════════════════════════════════

function saveEdit(id) {
  const form=document.querySelector('.edit-form.open'), ex=findEx(id);
  if (!form||!ex) return;
  const v=f=>{ const i=form.querySelector('[data-f="'+f+'"]'); return i?i.value.trim():''; };
  const newSets=Math.max(1,Math.min(20,parseInt(v('sets'))||ex.sets));
  ex.name=v('name')||ex.name; ex.sets=newSets; ex.reps=v('reps')||ex.reps;
  ex.weight=v('weight'); ex.notes=v('notes');
  if (getDone(id)>newSets) setDone(id,newSets);
  saveAll(); editingId=null; renderMain(); renderHeader();
}

function deleteExercise(id) {
  if (!confirm('Delete this exercise?')) return;
  workouts[viewDay].exercises=workouts[viewDay].exercises.filter(e=>e.id!==id);
  saveAll(); editingId=null; renderMain(); renderHeader();
}

document.getElementById('fabAdd').addEventListener('click',()=>{
  document.getElementById('sheetTitle').textContent='Add Exercise';
  document.getElementById('addOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('nName').focus(),50);
});
function closeAdd() { document.getElementById('addOverlay').classList.remove('open'); }
document.getElementById('addCancel').addEventListener('click',closeAdd);
document.getElementById('addOverlay').addEventListener('click',e=>{if(e.target.id==='addOverlay')closeAdd();});

document.getElementById('addConfirm').addEventListener('click',()=>{
  const name=document.getElementById('nName').value.trim(); if (!name){document.getElementById('nName').focus();return;}
  const sets=Math.max(1,parseInt(document.getElementById('nSets').value)||3);
  const reps=document.getElementById('nReps').value.trim()||'10-12';
  const weight=document.getElementById('nWeight').value.trim();
  const notes=document.getElementById('nNotes').value.trim();
  workouts[viewDay].exercises.push({id:'c'+(nextId++),name,sets,reps,weight,notes});
  saveAll();
  ['nName','nReps','nWeight','nNotes'].forEach(k=>{document.getElementById(k).value='';});
  document.getElementById('nSets').value='3';
  closeAdd(); renderHeader(); renderMain();
});

document.getElementById('fabReset').addEventListener('click',()=>document.getElementById('resetDialog').classList.add('open'));
document.getElementById('resetNo').addEventListener('click', ()=>document.getElementById('resetDialog').classList.remove('open'));
document.getElementById('resetYes').addEventListener('click',()=>{
  const ds=viewDayStr();
  if(completions[ds]){delete completions[ds];lsSet('wt-done',completions);}
  // Also drop the history snapshot for that day, or the History tab keeps
  // reporting the sets we just cleared.
  const hist=lsGet('wt-history')||{};
  if(hist[ds]){delete hist[ds];lsSet('wt-history',hist);}
  scheduleSyncToGist();
  document.getElementById('resetDialog').classList.remove('open');
  stopTimer(); renderHeader(); renderMain();
});

function goDay(idx) {
  viewDay=((idx%7)+7)%7; editingId=null;
  renderHeader(); renderMain();
}

let sx=0,sy=0;
document.getElementById('app').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.getElementById('app').addEventListener('touchend',e=>{
  // Only swipe-to-change-day on the Train tab — the Coach, Meal and History views
  // live inside #app too, and a sideways scroll there used to move the workout day.
  if (currentTab !== 'train') return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if (Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5) goDay(viewDay+(dx<0?1:-1));
},{passive:true});

//  SVG BODY BUILDER

function buildBodySVG(muscleHighlights, view) {
  const SN = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(SN, 'svg');
  svg.setAttribute('viewBox', '0 0 80 162');
  svg.style.cssText = 'width:100%;height:auto;display:block;';

  function el(tag, attrs, txt) {
    const e = document.createElementNS(SN, tag);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, String(v)));
    if (txt != null) e.textContent = txt;
    return e;
  }

  const bg = '#141210', st = '#282420', sw = '0.7';
  const base = {fill:bg, stroke:st, 'stroke-width':sw};

  // ── body silhouette ──────────────────────────────────────────
  [
    el('ellipse', {...base, cx:40, cy:9,   rx:9,  ry:9}),                     // head
    el('rect',    {...base, x:36, y:17,    width:8,  height:7,  rx:2}),       // neck
    el('ellipse', {...base, cx:22, cy:28,  rx:9,  ry:6}),                     // L shoulder
    el('ellipse', {...base, cx:58, cy:28,  rx:9,  ry:6}),                     // R shoulder
    el('rect',    {...base, x:25, y:23,    width:30, height:53, rx:5}),       // torso
    el('rect',    {...base, x:9,  y:24,    width:13, height:42, rx:6}),       // L upper arm
    el('rect',    {...base, x:58, y:24,    width:13, height:42, rx:6}),       // R upper arm
    el('rect',    {...base, x:10, y:63,    width:11, height:30, rx:5}),       // L forearm
    el('rect',    {...base, x:59, y:63,    width:11, height:30, rx:5}),       // R forearm
    el('path',    {...base, d:'M23 76 L21 93 L37 94 L40 92 L43 94 L59 93 L57 76Z'}), // hip
    el('rect',    {...base, x:22, y:91,    width:15, height:40, rx:6}),       // L thigh
    el('rect',    {...base, x:43, y:91,    width:15, height:40, rx:6}),       // R thigh
    el('rect',    {...base, x:23, y:128,   width:13, height:30, rx:5}),       // L shin
    el('rect',    {...base, x:44, y:128,   width:13, height:30, rx:5}),       // R shin
  ].forEach(e => svg.appendChild(e));

  // view label
  svg.appendChild(el('text', {x:40,y:160,'text-anchor':'middle',fill:'#2C2922',
    'font-size':5.5,'font-family':'"DM Mono",monospace'}, view.toUpperCase()));

  // ── muscle highlights ─────────────────────────────────────────
  const defs = MUSCLE_DEFS[view] || {};
  Object.entries(muscleHighlights).forEach(([muscle, style]) => {
    const shapes = defs[muscle];
    if (!shapes) return;
    shapes.forEach(s => svg.appendChild(
      el('ellipse', {cx:s.cx, cy:s.cy, rx:s.rx, ry:s.ry,
        fill:style.color, opacity:String(style.opacity)})
    ));
  });

  return svg;
}

function buildMuscleCard(dayType) {
  const focus = DAY_MUSCLE_FOCUS[dayType];
  if (!focus) return null;
  const color = TYPE_COLOR[dayType] || '#C9A84C';

  const card = document.createElement('div'); card.className = 'muscle-card';

  const hdr = document.createElement('div'); hdr.className = 'muscle-card-hdr';
  const ttl = document.createElement('div'); ttl.className = 'muscle-card-title'; ttl.textContent = 'MUSCLES WORKED';
  const tag = document.createElement('div'); tag.className = 'muscle-card-tag';
  tag.textContent = dayType.toUpperCase() + ' DAY';
  hdr.appendChild(ttl); hdr.appendChild(tag);
  card.appendChild(hdr);

  function makeHighlights(viewFocus) {
    const h = {};
    Object.entries(viewFocus || {}).forEach(([m, {op}]) => { h[m] = {color, opacity:op}; });
    return h;
  }

  const row = document.createElement('div'); row.className = 'muscle-bodies';
  ['front','back'].forEach(v => {
    const wrap = document.createElement('div'); wrap.className = 'muscle-body-wrap';
    wrap.appendChild(buildBodySVG(makeHighlights(focus[v]), v));
    row.appendChild(wrap);
  });
  card.appendChild(row);

  // legend
  const leg = document.createElement('div'); leg.className = 'muscle-legend';
  const allMuscles = new Map();
  [...Object.entries(focus.front||{}), ...Object.entries(focus.back||{})].forEach(([m, {op}]) => {
    if (!allMuscles.has(m)) allMuscles.set(m, op);
  });
  [...allMuscles.entries()].sort((a,b) => b[1]-a[1]).forEach(([m, op]) => {
    const item = document.createElement('div'); item.className = 'muscle-legend-item';
    const dot  = document.createElement('div'); dot.className  = 'ml-dot';
    dot.style.background = color; dot.style.opacity = String(op);
    const lbl = document.createElement('span'); lbl.textContent = MUSCLE_LABELS[m] || m;
    item.appendChild(dot); item.appendChild(lbl); leg.appendChild(item);
  });
  card.appendChild(leg);
  return card;
}

//  MUSCLE VOLUME HEATMAP (history)
// ═══════════════════════════════════════════════════════════════

function calcMuscleVolume(history) {
  const vols = {};
  Object.values(history).forEach(session => {
    if (!session.exercises) return;
    session.exercises.forEach(ex => {
      const map = EXERCISE_MUSCLES[ex.name];
      if (!map || !ex.done) return;
      map.primary.forEach(m => { vols[m] = (vols[m]||0) + ex.done; });
      map.secondary.forEach(m => { vols[m] = (vols[m]||0) + ex.done * 0.5; });
    });
  });
  return vols;
}

const MUSCLE_BASE_COLORS = {
  chest:'#C9A84C', frontDelt:'#C9A84C', biceps:'#BFBDB3', core:'#C8552A',
  quads:'#C8552A', calves:'#9A9890', traps:'#BFBDB3', rhomboids:'#BFBDB3',
  lats:'#BFBDB3', rearDelt:'#BFBDB3', triceps:'#C9A84C', glutes:'#C8552A',
  hamstrings:'#C8552A',
};

function volumeToHighlights(volumes, view) {
  const h   = {};
  const max = Math.max(...Object.values(volumes), 1);
  const def = MUSCLE_DEFS[view] || {};
  Object.keys(def).forEach(m => {
    if ((volumes[m] || 0) > 0) {
      h[m] = {
        color:   MUSCLE_BASE_COLORS[m] || '#C9A84C',
        opacity: Math.max(0.15, Math.min(0.85, volumes[m] / max * 0.85 + 0.1)),
      };
    }
  });
  return h;
}

function getStrengthHistory(history, exerciseName) {
  const data = [];
  Object.values(history)
    .filter(s => s.exercises && s.exercises.length)
    .sort((a,b) => a.date.localeCompare(b.date))
    .forEach(s => {
      const ex = s.exercises.find(e => e.name === exerciseName);
      if (ex && ex.done > 0 && ex.weight) {
        const w = parseFloat(ex.weight);
        if (!isNaN(w) && w > 0) data.push({date: s.date, weight: w});
      }
    });
  return data;
}

function buildStrengthChart(points, color) {
  const SN = 'http://www.w3.org/2000/svg';
  const W = 300, H = 76, PL = 34, PR = 10, PT = 6, PB = 18;
  const iW = W-PL-PR, iH = H-PT-PB;
  const n  = points.length;

  const svg = document.createElementNS(SN, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.cssText = 'width:100%;height:auto;display:block;';

  function el(tag, attrs, txt) {
    const e = document.createElementNS(SN, tag);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, String(v)));
    if (txt != null) e.textContent = txt;
    return e;
  }

  const weights = points.map(p => p.weight);
  const rawMin  = Math.min(...weights), rawMax = Math.max(...weights);
  const pad     = Math.max((rawMax - rawMin) * 0.2, 5);
  const minW = rawMin - pad, maxW = rawMax + pad;

  function xp(i) { return PL + (n > 1 ? (i/(n-1))*iW : iW/2); }
  function yp(w) { return PT + iH - ((w - minW)/(maxW - minW))*iH; }

  // grid + y labels (3 ticks)
  [0, 0.5, 1].forEach(t => {
    const y = PT + iH - t*iH;
    svg.appendChild(el('line', {x1:PL, y1:y, x2:W-PR, y2:y, stroke:'#1E1C18', 'stroke-width':0.6}));
    const lv = Math.round(minW + t*(maxW-minW));
    svg.appendChild(el('text', {x:PL-3, y:y+2.5, 'text-anchor':'end', fill:'#3A3730',
      'font-size':6, 'font-family':'"DM Mono",monospace'}, String(lv)));
  });

  // area
  const pathD = points.map((p,i) => (i?'L':'M') + xp(i).toFixed(1) + ',' + yp(p.weight).toFixed(1)).join('');
  const areaD = pathD + ' L' + xp(n-1).toFixed(1)+',' + (PT+iH) + ' L' + PL+',' + (PT+iH) + 'Z';
  svg.appendChild(el('path', {d:areaD, fill:color, 'fill-opacity':'0.1', stroke:'none'}));
  svg.appendChild(el('path', {d:pathD, fill:'none', stroke:color, 'stroke-width':1.5,
    'stroke-linecap':'round', 'stroke-linejoin':'round'}));

  // dots + x labels (first, middle, last)
  points.forEach((p,i) => {
    svg.appendChild(el('circle', {cx:xp(i), cy:yp(p.weight), r:2.5, fill:color}));
  });
  [0, Math.floor(n/2), n-1].filter((v,i,a) => a.indexOf(v)===i).forEach(i => {
    const d   = new Date(points[i].date + 'T12:00:00');
    const lbl = (d.getMonth()+1) + '/' + d.getDate();
    svg.appendChild(el('text', {x:xp(i), y:H-4, 'text-anchor':'middle', fill:'#3A3730',
      'font-size':5.5, 'font-family':'"DM Mono",monospace'}, lbl));
  });

  // latest weight label
  const last = points[n-1];
  svg.appendChild(el('text', {x:xp(n-1), y:yp(last.weight)-5, 'text-anchor':'middle',
    fill:color, 'font-size':7.5, 'font-family':'"DM Mono",monospace', 'font-weight':'bold'},
    last.weight + ' lbs'));

  return svg;
}

//  WEIGHT CALCULATOR

// ─── PLAN RULES: the one place weights are decided ─────────────
// Every weight the app suggests comes from planFor(), and so does the sentence
// explaining it. The calculator, the Train cards and the Coach all call it and
// none computes a weight itself, so a number and its reason can never disagree.
// The AI Coach explains these numbers; it does not get to invent its own.

const DELOAD_WEEKS = [4, 8, 12];
const DELOAD_PCT   = 0.65;
const PLAN_PHASES  = [
  { n: 1, name: 'Accumulation',    weeks: '1–4',  aim: 'build your baseline' },
  { n: 2, name: 'Intensification', weeks: '5–8',  aim: 'steady progression'  },
  { n: 3, name: 'Peak',            weeks: '9–12', aim: 'push limits'         },
];

function weekInfo(week) {
  const w = Math.min(12, Math.max(1, Math.round(week) || 1));
  // A deload week closes its own phase: week 4 is Phase 1's deload, not Phase 2's.
  return { week: w, phase: PLAN_PHASES[Math.floor((w - 1) / 4)], deload: DELOAD_WEEKS.includes(w) };
}

function roundPlate(v) { return Math.round(v / 2.5) * 2.5; }
function fmtW(v) { return (Math.round(v * 10) / 10) + ' lbs'; }

function planExercise(name) {
  return ALL_EXERCISES_CALC.find(e => e.name === name || (e.also || []).includes(name)) || null;
}

// null for bodyweight moves and anything not in the 12-week plan.
function planFor(name, week = calcWeek) {
  const ex = planExercise(name);
  if (!ex || ex.bw) return null;
  const wi = weekInfo(week);
  const custom = parseFloat(calcStarts[ex.name]);
  const start = isFinite(custom) ? custom : ex.start;
  const steps = wi.phase.n - 1;
  const working = roundPlate(start + ex.incr * steps);
  const target = wi.deload ? roundPlate(working * DELOAD_PCT) : working;
  const from = (isFinite(custom) ? 'your ' : 'the plan’s ') + fmtW(start) + ' start';
  const phaseTxt = 'Phase ' + wi.phase.n + ' (' + wi.phase.name + ')';
  let why;
  if (wi.deload)       why = 'Deload: 65% of your ' + fmtW(working) + ' ' + wi.phase.name + ' weight. Same reps, focus on form.';
  else if (steps === 0) why = phaseTxt + ': ' + from + ', no increase yet.';
  else                  why = phaseTxt + ': ' + from + ' + ' + steps + ' × ' + fmtW(ex.incr) + '.';
  return { target, working, start, steps, incr: ex.incr, week: wi.week, phase: wi.phase, deload: wi.deload, why };
}

// What the schedule can't know, said once wherever targets appear.
const PLAN_LIMIT_NOTE = 'Targets follow the 12-week schedule. The app records sets, not reps, so it can’t tell whether you reached the top of your rep range. If you didn’t, stay at your current weight (double progression).';

function renderCalcSheet() {
  const container = document.getElementById('calcBody');
  container.textContent = '';

  const lbl = document.createElement('div'); lbl.className = 'calc-lbl'; lbl.textContent = 'CURRENT WEEK';
  container.appendChild(lbl);

  const weekRow = document.createElement('div'); weekRow.className = 'calc-week-row';
  for (let w = 1; w <= 12; w++) {
    const isDeload = [4,8,12].includes(w);
    const btn = document.createElement('button');
    btn.className = 'calc-wk-btn' + (w === calcWeek ? ' active' : '') + (isDeload ? ' is-deload' : '');
    btn.textContent = String(w);
    btn.addEventListener('click', () => {
      calcWeek = w; lsSet('wt-calc-week', w);
      renderCalcSheet(); renderMain();   // Plan lines on the cards depend on the week
    });
    weekRow.appendChild(btn);
  }
  container.appendChild(weekRow);

  const wi = weekInfo(calcWeek), isDeloadWeek = wi.deload;
  const banner = document.createElement('div'); banner.className = 'calc-phase-banner';
  banner.style.color      = isDeloadWeek ? 'var(--rust)' : 'var(--day-color)';
  banner.style.background = isDeloadWeek ? 'rgba(200,85,42,.07)' : 'color-mix(in srgb, var(--day-color) 7%, transparent)';
  banner.style.borderColor= isDeloadWeek ? 'rgba(200,85,42,.2)' : 'color-mix(in srgb, var(--day-color) 20%, transparent)';
  banner.textContent = isDeloadWeek
    ? 'DELOAD — WEEK ' + wi.week + ' — 65% of your Phase ' + wi.phase.n + ' weight, focus on form'
    : 'PHASE ' + wi.phase.n + ' — WEEKS ' + wi.phase.weeks + ' — ' + wi.phase.name + ': ' + wi.phase.aim;
  container.appendChild(banner);
  const note = document.createElement('div'); note.className = 'plan-note'; note.textContent = PLAN_LIMIT_NOTE;
  container.appendChild(note);

  const thdr = document.createElement('div'); thdr.className = 'calc-table-hdr';
  [['EXERCISE','flex:1'],['START WT','width:62px;text-align:center'],['TARGET','width:60px;text-align:right']].forEach(([t,s]) => {
    const sp = document.createElement('span'); sp.textContent = t; sp.style.cssText = s;
    thdr.appendChild(sp);
  });
  container.appendChild(thdr);

  ALL_EXERCISES_CALC.forEach((ex, idx) => {
    const row  = document.createElement('div'); row.className = 'calc-row';
    const name = document.createElement('div'); name.className = 'calc-row-name'; name.textContent = ex.name;

    const startInp = document.createElement('input');
    startInp.className = 'calc-start-inp';
    startInp.type = 'text';
    startInp.value = calcStarts[ex.name] != null ? String(calcStarts[ex.name]) : (ex.bw ? 'BW' : String(ex.start));
    startInp.placeholder = ex.bw ? 'BW' : String(ex.start);
    if (ex.bw) startInp.disabled = true;
    startInp.addEventListener('change', () => {
      const v = parseFloat(startInp.value);
      if (!isNaN(v)) { calcStarts[ex.name] = v; lsSet('wt-calc-starts', calcStarts); renderCalcSheet(); renderMain(); }
    });

    const tgt = document.createElement('div');
    if (ex.bw) {
      tgt.className = 'calc-target-val is-bw'; tgt.textContent = 'BW';
    } else {
      const plan = planFor(ex.name, calcWeek);
      tgt.className = 'calc-target-val ' + (isDeloadWeek ? 'is-deload' : 'is-working');
      tgt.textContent = fmtW(plan.target);
      tgt.title = plan.why;
    }

    row.appendChild(name); row.appendChild(startInp); row.appendChild(tgt);
    container.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════════════
//  INTAKE (daily food log · label scanning · limit flags)
// ═══════════════════════════════════════════════════════════════

// Groq model that reads label photos and estimates described meals: vision + JSON mode.
// Checked against console.groq.com/docs in Sep 2026 — Llama 4 Scout and Maverick are shut down.
const INTAKE_MODEL         = 'qwen/qwen3.8-27b';
const INTAKE_STORE         = 'wt-intake';
const INTAKE_TARGETS_STORE = 'wt-intake-targets';

// kind: 'target' aim for it, flag when well over · 'min' reach at least · 'limit' stay under
//       'avoid' any amount is flagged · 'info' shown, never flagged
// Cholesterol is info-only: current US Dietary Guidelines dropped the numeric cap, and
// flagging it would mark the 4-egg breakfast in MEAL_PLAN as something to cut every day.
const NUTRIENTS = [
  { k:'kcal',        label:'Calories',    short:'Kcal',      unit:'kcal', kind:'target' },
  { k:'protein',     label:'Protein',     short:'Protein g', unit:'g',    kind:'min'    },
  { k:'carbs',       label:'Carbs',       short:'Carbs g',   unit:'g',    kind:'target' },
  { k:'fat',         label:'Fat',         short:'Fat g',     unit:'g',    kind:'target' },
  { k:'sodium',      label:'Sodium',      short:'Sodium mg', unit:'mg',   kind:'limit'  },
  { k:'addedSugar',  label:'Added sugar', short:'Add. sug g',unit:'g',    kind:'limit'  },
  { k:'satFat',      label:'Sat. fat',    short:'Sat fat g', unit:'g',    kind:'limit'  },
  { k:'fiber',       label:'Fiber',       short:'Fiber g',   unit:'g',    kind:'min'    },
  { k:'sugar',       label:'Total sugar', short:'Sugar g',   unit:'g',    kind:'info'   },
  { k:'transFat',    label:'Trans fat',   short:'Trans g',   unit:'g',    kind:'avoid'  },
  { k:'cholesterol', label:'Cholesterol', short:'Chol. mg',  unit:'mg',   kind:'info'   },
];
const TARGET_OVER = 1.10;  // 'target' nutrients flag once 10% past the goal
const LIMIT_WARN  = 0.80;  // 'limit' bars turn amber at 80% of the limit
const ITEM_HIGH   = 0.20;  // FDA label rule: 20%+ of the daily value in one food is "high"
const ITEM_HOT    = 0.50;  // half a day's limit in one food gets the red chip

let intakeOffset    = 0;   // 0 = today, -1 = yesterday, …
let inRecentCache   = [];
let inDraft         = null;

function mk(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function intakeDefaults() {
  // Macros are summed from MEAL_PLAN so this tab and the Meal tab always agree.
  // Limits are the FDA daily values printed on every US nutrition label.
  const sum = k => MEAL_PLAN.reduce((a, m) => a + (m[k] || 0), 0);
  return { kcal: sum('kcal'), protein: sum('protein'), carbs: sum('carbs'), fat: sum('fat'),
           fiber: 28, sodium: 2300, addedSugar: 50, satFat: 20 };
}
function intakeTargets() { return Object.assign(intakeDefaults(), lsGet(INTAKE_TARGETS_STORE) || {}); }

function intakeDate() {
  const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + intakeOffset);
  return d;
}
function intakeDateStr() { return isoLocal(intakeDate()); }
function intakeAll()     { return lsGet(INTAKE_STORE) || {}; }
function intakeDay(ds)   { return intakeAll()[ds] || []; }
function intakeSaveDay(ds, entries) {
  const all = intakeAll();
  if (entries.length) all[ds] = entries; else delete all[ds];
  lsSet(INTAKE_STORE, all);
  scheduleSyncToGist();
}

// What was actually eaten: per-serving values × servings. Missing values count as 0.
function eaten(entry) {
  const out = {}, s = entry.servings > 0 ? entry.servings : 1;
  NUTRIENTS.forEach(({ k }) => {
    const v = entry.n && entry.n[k];
    out[k] = (typeof v === 'number' && isFinite(v)) ? v * s : 0;
  });
  return out;
}
function dayTotals(entries) {
  const t = Object.fromEntries(NUTRIENTS.map(({ k }) => [k, 0]));
  entries.forEach(e => { const x = eaten(e); NUTRIENTS.forEach(({ k }) => { t[k] += x[k]; }); });
  return t;
}
function nutrientState(n, total, target) {
  if (!(target > 0)) return 'ok';
  const r = total / target;
  if (n.kind === 'limit')  return r >= 1 ? 'over' : r >= LIMIT_WARN ? 'warn' : 'ok';
  if (n.kind === 'target') return r > TARGET_OVER ? 'over' : r >= 0.9 ? 'met' : 'ok';
  if (n.kind === 'min')    return r >= 1 ? 'met' : 'ok';
  return 'ok';
}
// Foods to eat less of: one item carrying ≥20% of a daily limit, or any trans fat.
function itemFlags(entry, targets) {
  const x = eaten(entry), flags = [];
  NUTRIENTS.forEach(n => {
    if (n.kind === 'limit' && targets[n.k] > 0) {
      const pct = x[n.k] / targets[n.k];
      if (pct >= ITEM_HIGH) flags.push({ k: n.k, pct, hot: pct >= ITEM_HOT, text: n.label + ' ' + Math.round(pct * 100) + '%' });
    }
    if (n.kind === 'avoid' && x[n.k] > 0) flags.push({ k: n.k, pct: 99, hot: true, text: 'Trans fat · avoid' });
  });
  return flags.sort((a, b) => b.pct - a.pct);
}

function fmtN(v, unit) {
  const r = (unit === 'g') ? Math.round(v * 10) / 10 : Math.round(v);
  return r.toLocaleString() + (unit === 'kcal' ? '' : unit);
}
function fmtServings(s) { return (Math.round(s * 100) / 100).toString(); }

function intakeRecent(limit) {
  const all = intakeAll(), seen = new Set(), out = [];
  Object.keys(all).sort().reverse().slice(0, 21).forEach(ds => {
    (all[ds] || []).slice().reverse().forEach(e => {
      const k = (e.name || '').trim().toLowerCase();
      if (!k || seen.has(k) || out.length >= limit) return;
      seen.add(k); out.push(e);
    });
  });
  return out;
}

function bar(val, target) {
  const b = mk('div', 'in-bar'), i = mk('i');
  i.style.width = (target > 0 ? Math.min(100, (val / target) * 100) : 0) + '%';
  b.appendChild(i);
  return b;
}

function nutRow(n, tot, targets) {
  const state = nutrientState(n, tot[n.k], targets[n.k]);
  const row = mk('div', 'in-row state-' + state);
  const top = mk('div', 'in-row-top');
  const l = mk('div', 'in-row-lbl', n.label);
  const tagText = { over: n.kind === 'limit' ? 'Over limit' : 'Over', warn: 'Near limit', met: n.kind === 'min' ? 'Hit' : 'On target' }[state];
  if (tagText) l.appendChild(mk('span', 'in-tag', tagText));
  const v = mk('div', 'in-row-val', fmtN(tot[n.k], n.unit) + ' ');
  v.appendChild(mk('em', '', '/ ' + fmtN(targets[n.k], n.unit)));
  top.appendChild(l); top.appendChild(v);
  row.appendChild(top);
  row.appendChild(bar(tot[n.k], targets[n.k]));
  return row;
}

function renderIntakeAlerts(c, entries, tot, targets) {
  // 1. What you're taking in too much of today, with the foods responsible.
  // Worst offender first.
  const over = NUTRIENTS.filter(n =>
    (n.kind === 'limit' || n.kind === 'target') && nutrientState(n, tot[n.k], targets[n.k]) === 'over')
    .sort((a, b) => tot[b.k] / targets[b.k] - tot[a.k] / targets[a.k]);

  // 2. Which foods to eat less of / avoid — merged by name, strongest hit wins.
  const byName = new Map();
  entries.forEach(e => {
    const f = itemFlags(e, targets);
    if (!f.length) return;
    const key = (e.name || '').trim().toLowerCase();
    const cur = byName.get(key) || { name: e.name, flags: new Map() };
    f.forEach(fl => { const had = cur.flags.get(fl.k); if (!had || fl.pct > had.pct) cur.flags.set(fl.k, fl); });
    byName.set(key, cur);
  });
  const flagged = [...byName.values()]
    .map(x => ({ name: x.name, flags: [...x.flags.values()].sort((a, b) => b.pct - a.pct) }))
    .sort((a, b) => b.flags[0].pct - a.flags[0].pct);

  if (!over.length && !flagged.length) {
    c.appendChild(mk('div', 'in-ok', '✓ Nothing over your limits so far'));
    return;
  }

  if (over.length) {
    const box = mk('div', 'in-alert');
    box.appendChild(mk('div', 'in-alert-hd', 'Too much today'));
    over.forEach(n => {
      const row = mk('div', 'in-over-row');
      const top = mk('div', 'in-over-top', n.label);
      top.appendChild(mk('span', 'in-over-amt',
        fmtN(tot[n.k], n.unit) + ' / ' + fmtN(targets[n.k], n.unit) + ' · +' + fmtN(tot[n.k] - targets[n.k], n.unit)));
      row.appendChild(top);
      const sources = entries.map(e => ({ name: e.name, v: eaten(e)[n.k] }))
        .filter(s => s.v > 0).sort((a, b) => b.v - a.v).slice(0, 3);
      if (sources.length) {
        const src = mk('div', 'in-over-src', 'Mostly from ');
        sources.forEach((s, i) => {
          if (i) src.appendChild(document.createTextNode(' · '));
          src.appendChild(mk('b', '', s.name));
          src.appendChild(document.createTextNode(' ' + fmtN(s.v, n.unit)));
        });
        row.appendChild(src);
      }
      box.appendChild(row);
    });
    c.appendChild(box);
  }

  if (flagged.length) {
    const box = mk('div', 'in-alert' + (over.length ? '' : ' avoid-only'));
    box.appendChild(mk('div', 'in-alert-hd', 'Eat less of / avoid'));
    box.appendChild(mk('div', 'in-alert-sub', 'Foods carrying 20%+ of a daily limit in one go — the FDA’s line for “high”.'));
    flagged.forEach(f => {
      const row = mk('div', 'in-avoid-row');
      row.appendChild(mk('div', 'in-avoid-name', f.name));
      const chips = mk('div', 'in-flags');
      f.flags.forEach(fl => chips.appendChild(mk('span', 'in-flag' + (fl.hot ? ' hot' : ''), fl.text)));
      row.appendChild(chips);
      box.appendChild(row);
    });
    c.appendChild(box);
  }
}

function entryRow(e, targets) {
  const row = mk('button', 'in-entry'); row.dataset.entry = e.id;
  const main = mk('div', 'in-entry-main');
  main.appendChild(mk('div', 'in-entry-name', e.name));

  parts.push('P ' + Math.round(x.protein) + ' · C ' + Math.round(x.carbs) + ' · F ' + Math.round(x.fat));

    parts.push(new Date(e.t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s/g, ' '));
  }
  meta.appendChild(document.createTextNode(' · ' + parts.join(' · ')));
  main.appendChild(meta);
  const flags = itemFlags(e, targets);
  if (flags.length) {
    const chips = mk('div', 'in-flags');

    main.appendChild(chips);

  k.appendChild(mk('b', '', fmtN(x.kcal, 'kcal')));

  row.appendChild(main); row.appendChild(k);
  return row;
}

// ─── AI: read a label photo / estimate a described meal ────────

function fileToJpegDataUrl(file, maxSide = 1600, quality = 0.85) {
  // Phone photos are 3–12MB. Downscale so the upload is ~0.5MB and fast on cell data,
  // while keeping label text legible.
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.naturalWidth * s));
      cv.height = Math.max(1, Math.round(img.naturalHeight * s));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Couldn’t open that image. Try a different photo.')); };
    img.src = url;
  });
}

function parseJSONLoose(s) {
  try { return JSON.parse(s); } catch (e) { /* fall through */ }
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (e) { /* fall through */ } }
  throw new Error('Got an unreadable answer back. Try again.');
}

async function groqJSON(messages, signal) {
  const key = coachGetKey();
  if (!key) throw new Error('Add your Groq key in the Coach tab first.');
  let res;
  try {
    res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST', signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
      body: JSON.stringify({
        model: INTAKE_MODEL, messages,
        temperature: 0.1,
        max_completion_tokens: 1500,
        response_format: { type: 'json_object' },
        reasoning_effort: 'none',   // reading a label is recall, not reasoning — keeps it fast
      }),
    });
  } catch (err) {
    if (err.name === 'AbortError') throw err;
    throw new Error('No connection. Check your signal and try again.');
  }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401) throw new Error('Groq rejected your API key. Update it in the Coach tab.');
    if (res.status === 429) throw new Error('Groq’s rate limit was hit. Wait a minute and try again.');
    throw new Error((data && data.error && data.error.message) || ('Groq returned an error (' + res.status + ').'));
  }
  return parseJSONLoose((data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '');
}

const NUT_SCHEMA = '{"kcal":n,"protein":n,"carbs":n,"fat":n,"satFat":n,"transFat":n,"sugar":n,"addedSugar":n,"fiber":n,"sodium":n,"cholesterol":n}';

function cleanNutrients(src, allowNull) {
  const n = {};
  NUTRIENTS.forEach(({ k }) => {
    const raw = src ? src[k] : null;
    const v = typeof raw === 'string' ? parseFloat(raw.replace(/[^0-9.]/g, '')) : raw;
    n[k] = (typeof v === 'number' && isFinite(v) && v >= 0) ? Math.round(v * 10) / 10 : (allowNull ? null : 0);
  });
  return n;
}
function cleanText(v, max) { return (v == null ? '' : String(v)).replace(/\s+/g, ' ').trim().slice(0, max); }
function blankItem() { return { name: '', serving: '', servings: 1, n: cleanNutrients({}, true) }; }

async function aiReadLabel(dataUrl, signal) {
  const out = await groqJSON([{ role: 'user', content: [
    { type: 'text', text:
      'Read the nutrition facts label in this photo. Reply with JSON only, in this shape:\n' +
      '{"readable": true, "name": string, "serving": string, "per_serving": ' + NUT_SCHEMA + '}\n' +
      'Rules:\n' +
      '- Use the PER SERVING values. Never the per-container column, and never the %DV column.\n' +
      '- If the label only gives values per 100g or 100ml, use those and set "serving" to "100g" or "100ml".\n' +
      '- Units: kcal for calories; grams for protein, carbs, fat, satFat, transFat, sugar, addedSugar, fiber; milligrams for sodium and cholesterol.\n' +
      '- "name": the product name if you can see it, otherwise a short description of the food.\n' +
      '- "serving": the serving size exactly as printed, e.g. "2/3 cup (55g)".\n' +
      '- Use null for anything not printed on the label. Do not guess missing values.\n' +
      '- If this is not a nutrition label, or it is too blurry to read the numbers, reply {"readable": false}.' },
    { type: 'image_url', image_url: { url: dataUrl } },
  ]}], signal);
  if (!out || out.readable === false || !out.per_serving) {
    throw new Error('Couldn’t read a nutrition label in that photo. Try again with the label flat, filling the frame, in good light.');
  }
  return { name: cleanText(out.name, 80) || 'Scanned item', serving: cleanText(out.serving, 60),
           servings: 1, n: cleanNutrients(out.per_serving, true) };
}

async function aiEstimate(text, signal) {
  const out = await groqJSON([
    { role: 'system', content:
      'You estimate the nutrition of food someone describes eating. Reply with JSON only, in this shape:\n' +
      '{"items": [{"name": string, "serving": string, "per_serving": ' + NUT_SCHEMA + '}]}\n' +
      'Rules:\n' +
      '- One item per distinct food or drink.\n' +
      '- "serving" is the amount eaten as described (e.g. "2 large eggs"); per_serving is the nutrition for THAT whole amount.\n' +
      '- If no amount is given, assume one typical portion and write it in "serving".\n' +
      '- Base estimates on typical USDA values. For restaurant or fast food, use that chain\'s published values if you know them — restaurant sodium is usually far higher than home cooking.\n' +
      '- Units: kcal; grams for macros, sugars, fiber and fats; milligrams for sodium and cholesterol.\n' +
      '- Give a number for every field.' },
    { role: 'user', content: text },
  ], signal);
  const items = out && Array.isArray(out.items) ? out.items : [];
  if (!items.length) throw new Error('Couldn’t tell what that was. Try naming each food and roughly how much.');
  return items.slice(0, 12).map(it => ({
    name: cleanText(it.name, 80) || 'Food', serving: cleanText(it.serving, 60),
    servings: 1, n: cleanNutrients(it.per_serving, false),
  }));
}

function inNeedKey() {
  inOpen({ mode: 'error', src: 'nokey', error:
    'Scanning labels and estimating meals use your Groq API key — the same one the Coach uses. It’s free at console.groq.com.' });
}

function inStartScan() {
  if (!coachGetKey()) { inNeedKey(); return; }
  const f = document.getElementById('intakeFile');
  f.value = '';
  f.click();
}

document.getElementById('intakeFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const abort = new AbortController();
  inOpen({ mode: 'loading', src: 'label', date: intakeDateStr(), abort });
  try {
    const dataUrl = await fileToJpegDataUrl(file);
    if (!inDraft || inDraft.abort !== abort) return;         // cancelled while resizing
    inDraft.thumb = dataUrl; renderIntakeSheet();
    const item = await aiReadLabel(dataUrl, abort.signal);
    if (!inDraft || inDraft.abort !== abort) return;
    Object.assign(inDraft, { mode: 'review', items: [item], abort: null, thumb: null });
    renderIntakeSheet();
  } catch (err) {
    if (err.name === 'AbortError' || !inDraft || inDraft.abort !== abort) return;
    Object.assign(inDraft, { mode: 'error', error: err.message, abort: null, thumb: null });
    renderIntakeSheet();
  }
});

async function inRunEstimate(text) {
  const abort = new AbortController();
  Object.assign(inDraft, { mode: 'loading', text, abort });
  renderIntakeSheet();
  try {
    const items = await aiEstimate(text, abort.signal);
    if (!inDraft || inDraft.abort !== abort) return;
    Object.assign(inDraft, { mode: 'review', items, abort: null });
    renderIntakeSheet();
  } catch (err) {
    if (err.name === 'AbortError' || !inDraft || inDraft.abort !== abort) return;
    Object.assign(inDraft, { mode: 'error', error: err.message, abort: null });
    renderIntakeSheet();
  }
}

function inOpen(draft) {
  inDraft = draft;
  renderIntakeSheet();
  document.getElementById('intakeOverlay').classList.add('open');
}
function inClose() {
  if (inDraft && inDraft.abort) inDraft.abort.abort();

  document.getElementById('intakeOverlay').classList.remove('open');
}

function sheetBtn(cls, text, act, i) {
  const b = mk('button', cls, text); b.dataset.sa = act;
  if (i != null) b.dataset.i = String(i);
  return b;
}

function renderIntakeSheet() {
  const s = document.getElementById('intakeSheet');
  s.textContent = '';
  const d = inDraft; if (!d) return;

  const titles = {
    describe: 'What did you eat?',
    loading:  d.src === 'label' ? 'Reading label' : 'Estimating',
    error:    d.src === 'nokey' ? 'Groq key needed' : 'That didn’t work',
    review:   d.editId ? 'Edit food' : d.src === 'label' ? 'Check the label' : d.src === 'ai' ? 'Check the estimate' : 'Add food',
    targets:  'Daily targets',
  };
  s.appendChild(mk('div', 'sheet-title', titles[d.mode]));
  const actions = mk('div', 'sheet-actions');

  if (d.mode === 'describe') {
    s.appendChild(mk('div', 'in-sheet-note', 'Name each food and roughly how much — “2 scrambled eggs, slice of sourdough with butter” or “Chipotle chicken burrito bowl, white rice, black beans, cheese, guac”.'));
    const ta = mk('textarea', 'ef-inp in-textarea'); ta.id = 'inDescribe';
    ta.value = d.text || ''; ta.placeholder = 'e.g. turkey sandwich on wheat and a small bag of chips';
    s.appendChild(ta);
    actions.appendChild(sheetBtn('btn-cancel', 'Cancel', 'cancel'));
    actions.appendChild(sheetBtn('btn-confirm', 'Estimate', 'estimate'));
    s.appendChild(actions);
    setTimeout(() => ta.focus(), 60);
    return;
  }

  if (d.mode === 'loading') {
    const box = mk('div', 'in-loading');
    if (d.thumb) { const img = mk('img', 'in-thumb'); img.src = d.thumb; img.alt = ''; box.appendChild(img); }
    box.appendChild(mk('div', 'in-spin'));
    box.appendChild(mk('div', 'in-loading-txt', d.src === 'label' ? (d.thumb ? 'Reading the numbers…' : 'Preparing photo…') : 'Working out the nutrition…'));
    s.appendChild(box);
    actions.appendChild(sheetBtn('btn-cancel', 'Cancel', 'cancel'));
    s.appendChild(actions);
    return;
  }

  if (d.mode === 'error') {
    s.appendChild(mk('div', 'in-err', d.error));
    actions.appendChild(sheetBtn('btn-cancel', 'Cancel', 'cancel'));
    if (d.src === 'nokey')  actions.appendChild(sheetBtn('btn-confirm', 'Go to Coach', 'coach'));
    if (d.src === 'label')  actions.appendChild(sheetBtn('btn-confirm', 'Try another photo', 'rescan'));
    if (d.src === 'ai')     actions.appendChild(sheetBtn('btn-confirm', 'Edit description', 'redescribe'));
    s.appendChild(actions);
    const man = sheetBtn('in-link', 'Enter it manually instead', 'manual');
    s.appendChild(man);
    return;
  }

  if (d.mode === 'targets') {
    const t = intakeTargets(), def = intakeDefaults();
    s.appendChild(mk('div', 'in-sheet-note', 'Calories and macros start from your meal plan. Sodium, added sugar, saturated fat and fiber start at the FDA daily values.'));
    const grid = mk('div', 'in-tgt-grid');
    ['kcal', 'protein', 'carbs', 'fat', 'fiber', 'sodium', 'addedSugar', 'satFat'].forEach(k => {
      const n = NUTRIENTS.find(x => x.k === k);
      const col = mk('label', 'ef-col');
      col.appendChild(mk('span', 'ef-lbl', n.label + (n.unit === 'kcal' ? '' : ' (' + n.unit + ')') + (n.kind === 'limit' ? ' max' : n.kind === 'min' ? ' min' : '')));
      const inp = mk('input', 'ef-inp mono'); inp.inputMode = 'numeric'; inp.dataset.tgt = k;
      inp.value = String(t[k]); inp.placeholder = String(def[k]);
      col.appendChild(inp); grid.appendChild(col);
    });
    s.appendChild(grid);
    actions.style.marginTop = '16px';
    actions.appendChild(sheetBtn('btn-cancel', 'Cancel', 'cancel'));
    actions.appendChild(sheetBtn('btn-confirm', 'Save', 'tgt-save'));
    s.appendChild(actions);
    s.appendChild(sheetBtn('in-link', 'Reset all to plan defaults', 'tgt-reset'));
    return;
  }

  // review
  const notes = {
    label:  'Read from your photo. Check the numbers match the label, then set how many servings you had.',
    ai:     'These are estimates. Adjust anything that looks off — portion size matters most.',
    manual: 'Enter what you know. Blank fields count as zero.',
  };
  if (!d.editId) s.appendChild(mk('div', 'in-sheet-note', notes[d.src] || notes.manual));
  d.items.forEach((it, i) => s.appendChild(reviewItem(it, i, d.items.length > 1)));
  if (!d.editId) s.appendChild(sheetBtn('in-add-item', '+ Add another food', 'add-item'));

  if (d.editId) actions.appendChild(sheetBtn('btn-del', 'Delete', 'delete'));
  actions.appendChild(sheetBtn('btn-cancel', 'Cancel', 'cancel'));
  actions.appendChild(sheetBtn('btn-confirm', d.editId ? 'Save' : d.items.length > 1 ? 'Add ' + d.items.length + ' foods' : 'Add', 'commit'));
  s.appendChild(actions);
}

function reviewItem(it, i, removable) {
  const box = mk('div', 'in-item');
  const hd = mk('div', 'in-item-hd');
  const name = mk('input', 'ef-inp'); name.value = it.name || ''; name.placeholder = 'Food name';
  name.dataset.f = 'name'; name.dataset.i = String(i);
  hd.appendChild(name);
  if (removable) { const x = sheetBtn('in-item-x', '✕', 'remove', i); x.setAttribute('aria-label', 'Remove'); hd.appendChild(x); }
  box.appendChild(hd);

  const srv = mk('div', 'in-srv');
  const sc = mk('label', 'ef-col');
  sc.appendChild(mk('span', 'ef-lbl', 'Serving size'));
  const sv = mk('input', 'ef-inp'); sv.value = it.serving || ''; sv.placeholder = 'e.g. 1 cup (240ml)';
  sv.dataset.f = 'serving'; sv.dataset.i = String(i);
  sc.appendChild(sv); srv.appendChild(sc);
  const stc = mk('div', 'ef-col'); stc.style.flex = '0 0 auto';
  stc.appendChild(mk('span', 'ef-lbl', 'Servings'));
  const step = mk('div', 'in-step');
  step.appendChild(sheetBtn('', '−', 'step-', i));
  const sn = mk('input'); sn.inputMode = 'decimal'; sn.value = fmtServings(it.servings || 1);
  sn.dataset.f = 'servings'; sn.dataset.i = String(i); sn.setAttribute('aria-label', 'Servings');
  step.appendChild(sn);
  step.appendChild(sheetBtn('', '+', 'step+', i));
  stc.appendChild(step); srv.appendChild(stc);
  box.appendChild(srv);

  const live = mk('div', 'in-live', liveText(it)); live.dataset.live = String(i);
  box.appendChild(live);

  box.appendChild(mk('div', 'ef-lbl', 'Per serving'));
  box.lastChild.style.marginBottom = '6px';
  const grid = mk('div', 'in-grid');
  NUTRIENTS.forEach(n => {
    const col = mk('label', 'ef-col' + (['kcal', 'protein', 'carbs', 'fat'].includes(n.k) ? ' hl' : ''));
    col.appendChild(mk('span', 'ef-lbl', n.short));
    const inp = mk('input', 'ef-inp mono'); inp.inputMode = 'decimal';
    const v = it.n ? it.n[n.k] : null;
    inp.value = v == null ? '' : String(v); inp.placeholder = '–';
    inp.dataset.n = n.k; inp.dataset.i = String(i);
    col.appendChild(inp); grid.appendChild(col);
  });
  box.appendChild(grid);
  return box;
}

function liveText(it) {
  const x = eaten(it);
  return 'You ate ' + fmtN(x.kcal, 'kcal') + ' kcal · P ' + Math.round(x.protein) + ' · C ' + Math.round(x.carbs) + ' · F ' + Math.round(x.fat);
}
function updateLive(i) {
  const it = inDraft && inDraft.items && inDraft.items[i];
  const el = document.querySelector('#intakeSheet [data-live="' + i + '"]');
  if (it && el) el.textContent = liveText(it);
}

function parseNum(v) {
  const s = String(v).replace(',', '.').replace(/[^0-9.]/g, '');
  if (s === '') return null;
  const n = parseFloat(s);
  return isFinite(n) && n >= 0 ? n : null;
}

document.getElementById('intakeOverlay').addEventListener('input', e => {
  const t = e.target, d = inDraft; if (!d || !d.items) return;
  const i = +t.dataset.i, it = d.items[i]; if (!it) return;
  if (t.dataset.f === 'name')     it.name = t.value;
  if (t.dataset.f === 'serving')  it.serving = t.value;
  if (t.dataset.f === 'servings') { const v = parseNum(t.value); if (v) it.servings = v; }
  if (t.dataset.n) { it.n = it.n || {}; it.n[t.dataset.n] = parseNum(t.value); }
  updateLive(i);
});

document.getElementById('intakeOverlay').addEventListener('click', e => {
  if (e.target.id === 'intakeOverlay') { inClose(); return; }
  const b = e.target.closest('[data-sa]'); if (!b) return;
  const d = inDraft; if (!d) return;
  const act = b.dataset.sa, i = b.dataset.i != null ? +b.dataset.i : -1;

  if (act === 'cancel') { inClose(); return; }
  if (act === 'coach')  { inClose(); document.querySelector('[data-tab="coach"]').click(); return; }
  if (act === 'rescan') { inClose(); inStartScan(); return; }
  if (act === 'redescribe') { Object.assign(d, { mode: 'describe', error: null }); renderIntakeSheet(); return; }
  if (act === 'manual') { Object.assign(d, { mode: 'review', src: 'manual', items: [blankItem()], error: null, date: d.date || intakeDateStr() }); renderIntakeSheet(); return; }

  if (act === 'estimate') {
    const ta = document.getElementById('inDescribe'), text = ta ? ta.value.trim() : '';
    if (!text) { ta && ta.focus(); return; }
    inRunEstimate(text);
    return;
  }

  if (act === 'step-' || act === 'step+') {
    const it = d.items[i]; if (!it) return;
    const cur = it.servings || 1;
    it.servings = act === 'step+' ? Math.round((cur + 0.5) * 100) / 100
                                  : Math.max(0.25, Math.round((cur - 0.5) * 100) / 100);
    const inp = document.querySelector('#intakeSheet input[data-f="servings"][data-i="' + i + '"]');
    if (inp) inp.value = fmtServings(it.servings);
    updateLive(i);
    return;
  }
  if (act === 'remove')   { d.items.splice(i, 1); renderIntakeSheet(); return; }
  if (act === 'add-item') { d.items.push(blankItem()); renderIntakeSheet(); return; }

  if (act === 'delete') {
    if (!confirm('Delete this food from your log?')) return;
    intakeSaveDay(d.date, intakeDay(d.date).filter(x => x.id !== d.editId));
    inClose(); renderIntake();
    return;
  }

  if (act === 'commit') {
    const now = new Date().toISOString();
    const clean = d.items.map((it, k) => ({
      id: it.id || ('f' + Date.now().toString(36) + k),
      t: it.t || now,
      src: it.src || d.src || 'manual',
      name: cleanText(it.name, 80) || 'Food',
      serving: cleanText(it.serving, 60),
      servings: it.servings > 0 ? it.servings : 1,
      n: cleanNutrients(it.n, true),
    }));
    const entries = intakeDay(d.date);
    if (d.editId) {
      const idx = entries.findIndex(x => x.id === d.editId);
      if (idx >= 0) entries[idx] = Object.assign(clean[0], { id: d.editId }); else entries.push(clean[0]);
    } else {
      entries.push(...clean);
    }
    intakeSaveDay(d.date, entries);
    inClose(); renderIntake();
    return;
  }

  if (act === 'tgt-save') {
    const def = intakeDefaults(), out = {};
    document.querySelectorAll('#intakeSheet [data-tgt]').forEach(inp => {
      const v = parseNum(inp.value), k = inp.dataset.tgt;
      if (v != null && v > 0 && v !== def[k]) out[k] = v;   // only store what differs from the plan
    });
    lsSet(INTAKE_TARGETS_STORE, out);
    scheduleSyncToGist();
    inClose(); renderIntake();
    return;
  }
  if (act === 'tgt-reset') {
    lsSet(INTAKE_TARGETS_STORE, {});
    scheduleSyncToGist();
    renderIntakeSheet();
    return;
  }
});

// ═══════════════════════════════════════════════════════════════

const GIST_TOKEN_KEY = 'wt-gh-token';
const GIST_ID_KEY    = 'wt-gh-gist-id';
const GIST_SYNC_KEY  = 'wt-gh-last-sync';
const GIST_FILENAME  = 'workout-data.json';
const SYNC_KEYS = ['wt-plans','wt-done','wt-nextid','wt-history','wt-grocery','wt-calc-week','wt-calc-starts','wt-coach-sessions','wt-intake','wt-intake-targets'];

let syncTimer = null;

function gistToken()   { return lsGet(GIST_TOKEN_KEY) || ''; }
function gistId()      { return lsGet(GIST_ID_KEY) || ''; }
function gistSaveToken(t) { lsSet(GIST_TOKEN_KEY, t); }
function gistSaveId(id)   { lsSet(GIST_ID_KEY, id); }

function showSyncBar(type, msg, autohide = true) {
  const bar = document.getElementById('syncBar');
  const txt = document.getElementById('syncMsg');
  bar.className = 'sync-bar show ' + type;
  txt.textContent = msg;
  if (autohide) setTimeout(() => { bar.classList.remove('show'); }, 3000);
}

function scheduleSyncToGist() {
  if (!gistToken()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToGist, 4000);
}

async function syncToGist() {
  const token = gistToken();
  if (!token) return;

  const data = {};
  SYNC_KEYS.forEach(k => { const v = lsGet(k); if (v !== null) data[k] = v; });

  showSyncBar('busy', 'Syncing…', false);

  try {
    const id = gistId();
    const body = {
      description: 'Workout App Data',
      public: false,
      files: { [GIST_FILENAME]: { content: JSON.stringify(data, null, 2) } },
    };

    let res;
    if (id) {
      res = await fetch(`https://api.github.com/gists/${id}`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } else {
      res = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    const json = await res.json();
    if (!res.ok) throw new Error(json.message || 'Sync failed');

    if (!id) gistSaveId(json.id);
    lsSet(GIST_SYNC_KEY, new Date().toISOString());
    showSyncBar('ok', '✓ Backed up to GitHub');
    // refresh history tab sync status if visible
    if (document.getElementById('gistStatusVal')) renderGistStatus();
  } catch(e) {
    showSyncBar('err', '✗ Sync failed: ' + e.message);
  }
}

async function findAndRestoreGist(token) {
  // Search user's gists for the workout data file — no Gist ID needed
  showSyncBar('busy', 'Finding your backup…', false);
  try {
    const res  = await fetch('https://api.github.com/gists?per_page=50', {
      headers: { Authorization: `Bearer ${token}` },
    });
    const list = await res.json();
    if (!res.ok) throw new Error(list.message || 'Could not list gists');

    const found = list.find(g => g.files?.[GIST_FILENAME]);
    if (!found) throw new Error('No workout backup found in your gists');

    gistSaveId(found.id);
    await restoreFromGist();
  } catch(e) {
    showSyncBar('err', '✗ ' + e.message);
  }
}

async function restoreFromGist() {
  const token = gistToken();
  const id    = gistId();
  if (!token || !id) { showSyncBar('err', 'No Gist configured'); return; }

  // Restoring replaces everything on this device. Say so before doing it.
  const localSessions = Object.keys(lsGet('wt-history') || {}).length;
  if (!confirm(
    'Restore from GitHub?\n\n' +
    'This replaces all workout data on this device' +
    (localSessions ? ` (${localSessions} logged session${localSessions === 1 ? '' : 's'})` : '') +
    ' with the backup. This cannot be undone.'
  )) return;

  showSyncBar('busy', 'Restoring…', false);
  try {
    const res  = await fetch(`https://api.github.com/gists/${id}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.message || 'Fetch failed');

    const file = json.files?.[GIST_FILENAME];
    // Gists over 1MB come back truncated — the full copy lives at raw_url.
    // Without this, a long history restores as invalid JSON or partial data.
    let content = file?.content;
    if (file?.truncated && file?.raw_url) {
      const rawRes = await fetch(file.raw_url);
      if (!rawRes.ok) throw new Error('Could not fetch full backup');
      content = await rawRes.text();
    }
    if (!content) throw new Error('No data file found in Gist');

    const data = JSON.parse(content);
    SYNC_KEYS.forEach(k => { if (data[k] !== undefined) lsSet(k, data[k]); });

    workouts       = lsGet('wt-plans')       || defaultData();
    completions    = lsGet('wt-done')        || {};
    nextId         = lsGet('wt-nextid')      || 500;
    calcWeek       = lsGet('wt-calc-week')   || 1;
    calcStarts     = lsGet('wt-calc-starts') || {};
    groceryChecked = lsGet('wt-grocery')     || {};

    lsSet(GIST_SYNC_KEY, new Date().toISOString());
    showSyncBar('ok', '✓ Restored from GitHub');
    renderHeader(); renderMain();
    renderHistoryGistSection();
  } catch(e) {
    showSyncBar('err', '✗ Restore failed: ' + e.message);
  }
}

function renderGistStatus() {
  const el = document.getElementById('gistStatusVal');
  if (!el) return;
  const last = lsGet(GIST_SYNC_KEY);
  if (last) {
    const d = new Date(last);
    el.textContent = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  } else {
    el.textContent = 'Never';
  }
}

function buildGistSection() {
  const wrap = document.createElement('div');
  const token = gistToken();

  if (!token) {
    const card = document.createElement('div'); card.className = 'gist-setup-wrap';

    const title = document.createElement('div'); title.className = 'gist-setup-title';
    title.textContent = 'GitHub Backup';
    card.appendChild(title);

    const sub = document.createElement('div'); sub.className = 'gist-setup-sub';
    sub.textContent = 'Auto-syncs your data to a private GitHub Gist.\nGet a token: github.com → Settings → Developer\nSettings → Tokens (classic) → check "gist" scope.';
    card.appendChild(sub);

    const inp = document.createElement('input');
    inp.type = 'password'; inp.className = 'gist-inp';
    inp.placeholder = 'Paste GitHub token (ghp_xxx…)';
    card.appendChild(inp);

    const btnRow = document.createElement('div'); btnRow.className = 'gist-btn-row';

    const saveBtn = document.createElement('button'); saveBtn.className = 'gist-save-btn';
    saveBtn.textContent = 'CONNECT & SYNC';
    saveBtn.addEventListener('click', () => {
      const t = inp.value.trim(); if (!t) return;
      gistSaveToken(t);
      syncToGist().then(() => renderHistoryGistSection());
    });
    btnRow.appendChild(saveBtn);

    // Restore — token only, auto-finds the gist
    const restoreBtn = document.createElement('button'); restoreBtn.className = 'gist-restore-btn';
    restoreBtn.textContent = 'RESTORE';
    restoreBtn.title = 'Find & restore backup using token only';
    restoreBtn.addEventListener('click', () => {
      const t = inp.value.trim(); if (!t) { showSyncBar('err', 'Enter your token first'); return; }
      gistSaveToken(t);
      findAndRestoreGist(t);
    });
    btnRow.appendChild(restoreBtn);

    card.appendChild(btnRow);
    wrap.appendChild(card);
  } else {
    // connected — status card
    const card = document.createElement('div'); card.className = 'gist-setup-wrap';

    const titleRow = document.createElement('div');
    titleRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
    const title = document.createElement('div'); title.className = 'gist-setup-title';
    title.style.marginBottom = '0';
    title.textContent = 'GitHub Backup';
    const connBadge = document.createElement('span');
    connBadge.style.cssText = 'font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.12em;color:#6fcf6f;text-transform:uppercase';
    connBadge.textContent = '● Connected';
    titleRow.appendChild(title); titleRow.appendChild(connBadge);
    card.appendChild(titleRow);

    // last synced row
    const syncRow = document.createElement('div');
    syncRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
    const syncLbl = document.createElement('div'); syncLbl.className = 'gist-setup-sub';
    syncLbl.style.marginBottom = '0';
    syncLbl.textContent = 'Last backed up';
    const syncVal = document.createElement('div'); syncVal.id = 'gistStatusVal';
    syncVal.style.cssText = 'font-family:"DM Mono",monospace;font-size:11px;color:var(--text)';
    renderGistStatus();
    syncRow.appendChild(syncLbl); syncRow.appendChild(syncVal);
    card.appendChild(syncRow);

    // gist ID row (important for reinstall reference)
    const idRow = document.createElement('div');
    idRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px';
    const idLbl = document.createElement('div'); idLbl.className = 'gist-setup-sub';
    idLbl.style.marginBottom = '0'; idLbl.textContent = 'Gist ID';
    const idVal = document.createElement('div');
    const storedId = gistId();
    idVal.style.cssText = 'font-family:"DM Mono",monospace;font-size:9px;color:var(--text-dim);word-break:break-all;text-align:right;max-width:60%';
    idVal.textContent = storedId ? storedId.slice(0,16) + '…' : '—';
    idVal.title = storedId || '';
    idRow.appendChild(idLbl); idRow.appendChild(idVal);
    card.appendChild(idRow);

    const btns = document.createElement('div'); btns.className = 'gist-btn-row';

    const syncNowBtn = document.createElement('button'); syncNowBtn.className = 'gist-save-btn';
    syncNowBtn.style.fontSize = '15px';
    syncNowBtn.textContent = 'SYNC NOW';
    syncNowBtn.addEventListener('click', () => syncToGist());
    btns.appendChild(syncNowBtn);

    const restoreBtn = document.createElement('button'); restoreBtn.className = 'gist-restore-btn';
    restoreBtn.style.fontSize = '15px';
    restoreBtn.textContent = 'RESTORE';
    restoreBtn.addEventListener('click', () => restoreFromGist());
    btns.appendChild(restoreBtn);
    card.appendChild(btns);

    const disconnectBtn = document.createElement('button'); disconnectBtn.className = 'gist-sm-btn';
    disconnectBtn.style.marginTop = '8px';
    disconnectBtn.textContent = 'Disconnect';
    disconnectBtn.addEventListener('click', () => {
      lsSet(GIST_TOKEN_KEY, null); lsSet(GIST_ID_KEY, null);
      renderHistoryGistSection();
    });
    card.appendChild(disconnectBtn);

    wrap.appendChild(card);
  }

  // ── Check for Updates button ──────────────────────
  const updateCard = document.createElement('div'); updateCard.className = 'gist-setup-wrap';
  updateCard.style.marginTop = '10px';
  const updateTitle = document.createElement('div'); updateTitle.className = 'gist-setup-title';
  updateTitle.textContent = 'App Updates';
  updateCard.appendChild(updateTitle);
  const updateSub = document.createElement('div'); updateSub.className = 'gist-setup-sub';
  const r0 = RELEASES[0];
  updateSub.textContent = 'Running ' + APP_VERSION + ' · ' + r0.name + ' · ' + fmtReleaseDate(r0.date) +
    '.\nIf that’s older than you expect, the update hasn’t reached\nthis phone yet — Check for Updates fixes that.';
  updateCard.appendChild(updateSub);
  const notesBtn = document.createElement('button'); notesBtn.className = 'gist-restore-btn';
  notesBtn.style.cssText = 'font-size:15px;width:100%;margin-bottom:8px';
  notesBtn.textContent = 'WHAT’S NEW';
  notesBtn.addEventListener('click', openReleaseNotes);
  updateCard.appendChild(notesBtn);
  const updateBtn = document.createElement('button'); updateBtn.className = 'gist-save-btn';
  updateBtn.style.fontSize = '15px';
  updateBtn.textContent = 'CHECK FOR UPDATES';
  updateBtn.addEventListener('click', async () => {
    updateBtn.textContent = 'Clearing cache…';
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch(e) {}
    location.reload(true);
  });
  updateCard.appendChild(updateBtn);
  wrap.appendChild(updateCard);

  return wrap;
}

function renderHistoryGistSection() {
  const el = document.getElementById('gistSection');
  if (!el) return;
  el.textContent = '';
  el.appendChild(buildGistSection());
}

function getPrevWeight(exerciseName) {
  const history = lsGet('wt-history') || {};
  const sessions = Object.values(history)
    .filter(s => s.date !== TODAY_STR && s.exercises && s.exercises.length > 0)
    .sort((a, b) => b.date.localeCompare(a.date));
  for (const session of sessions) {
    const ex = session.exercises.find(e => e.name === exerciseName);
    if (ex && ex.weight && ex.done > 0) return ex.weight;
  }
  return null;
}

function saveHistorySnapshot() {
  const ds      = viewDayStr();
  const day     = workouts[viewDay];
  const dayC    = completions[ds] || {};
  const history = lsGet('wt-history') || {};

  if (day.type === 'rest') {
    const doneRec = (day.recovery || []).filter(r => dayC[r.id]).length;
    history[ds] = {
      date: ds, dayIdx: viewDay, type: 'rest',
      label: day.label, dayName: day.dayName,
      totalRec: (day.recovery || []).length, doneRec,
    };
  } else {
    const exercises = day.exercises.map(ex => ({
      id: ex.id, name: ex.name, sets: ex.sets, reps: ex.reps,
      weight: ex.weight, done: Math.min(dayC[ex.id] || 0, ex.sets),
    }));
    const totalSets = exercises.reduce((a, e) => a + e.sets, 0);
    const doneSets  = exercises.reduce((a, e) => a + e.done,  0);
    history[ds] = {
      date: ds, dayIdx: viewDay, type: day.type,
      label: day.label, dayName: day.dayName,
      exercises, totalSets, doneSets,
    };
  }
  lsSet('wt-history', history);
  scheduleSyncToGist();
}
