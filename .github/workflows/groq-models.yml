name: Groq model check

# Groq retires models on a schedule; llama-3.1-8b-instant went on 2026-08-16 and
# the Coach failed for weeks unnoticed. Every Monday this checks the models in
# index.html against Groq's deprecation page and opens an issue if one is going.
on:
  schedule:
    - cron: '17 14 * * 1'   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check Groq models
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check for retiring models
        run: node .github/scripts/check-groq-models.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
